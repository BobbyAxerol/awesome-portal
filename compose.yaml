name: ${PORTAL_STACK_NAME:-portal}

# This is the Portal monorepo entry point. `./scripts/portal up` builds every
# tracked module into one coherent stack with one public gateway.
services:
  portal-api:
    build:
      context: .
      dockerfile: deploy/images/portal-api.Dockerfile
    image: ${PORTAL_IMAGE_PREFIX:-local/portal}-portal-api:${PORTAL_IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      PORTAL_ARTIFACT_ROOT: /var/lib/portal/artifacts/runs
      PORTAL_HISTORICAL_DATA_MODE: ${PORTAL_HISTORICAL_DATA_MODE:-disabled}
      HISTORICAL_MARKET_DATA_ROOT: /data
      PORTAL_CRYPTO_RESAMPLE_ENGINE: ${PORTAL_CRYPTO_RESAMPLE_ENGINE:-duckdb}
      PORTAL_SUMMARY_DEADLINE_MS: ${PORTAL_SUMMARY_DEADLINE_MS:-500}
      PORTAL_ENVIRONMENT: ${PORTAL_ENVIRONMENT:-research}
      PORTAL_PLANNING_SUMMARY_MODE: ${PORTAL_PLANNING_SUMMARY_MODE:-local}
      PORTAL_PLANNING_API_BASE_URL: http://roadmap-task-board-api:8000
      PORTAL_PLANNING_SUMMARY_TIMEOUT_MS: ${PORTAL_PLANNING_SUMMARY_TIMEOUT_MS:-500}
      PORTAL_PLANNING_SUMMARY_MAX_BYTES: ${PORTAL_PLANNING_SUMMARY_MAX_BYTES:-65536}
    volumes:
      - portal-artifacts:/var/lib/portal/artifacts
      - ${PORTAL_HISTORICAL_DATA_DIR:-./runtime/historical-market-data}:/data:ro
    group_add:
      - ${PORTAL_HMD_READER_GID:-10001}
    expose:
      - "8000"
    networks:
      - portal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # The feature stays embedded in the public web image. This private companion
  # service owns its SQLite state, audit log and Discord outbox only.
  roadmap-task-board-api:
    build:
      context: .
      dockerfile: deploy/images/roadmap-task-board-api.Dockerfile
    image: ${PORTAL_IMAGE_PREFIX:-local/portal}-roadmap-task-board-api:${PORTAL_IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      PORTAL_ENV: ${ROADMAP_TASK_BOARD_ENV:-development}
      PORTAL_DATABASE_PATH: /var/lib/roadmap-task-board/portal.db
      PORTAL_PUBLIC_URL: ${ROADMAP_TASK_BOARD_PUBLIC_URL:-http://localhost:8080/roadmap-task-board}
      PORTAL_DEFAULT_ACTOR: ${ROADMAP_TASK_BOARD_DEFAULT_ACTOR:-local-user}
      PORTAL_CORS_ORIGINS: ${ROADMAP_TASK_BOARD_CORS_ORIGINS:-}
      PORTAL_LOG_LEVEL: ${ROADMAP_TASK_BOARD_LOG_LEVEL:-INFO}
      DISCORD_WEBHOOK_URL: ${ROADMAP_TASK_BOARD_DISCORD_WEBHOOK_URL:-}
    volumes:
      - roadmap-task-board-data:/var/lib/roadmap-task-board
    expose:
      - "8000"
    networks:
      - portal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  portal-web:
    build:
      context: .
      dockerfile: deploy/images/portal-web.Dockerfile
      args:
        ROADMAP_TASK_BOARD_LOCAL_ONLY: ${ROADMAP_TASK_BOARD_LOCAL_ONLY:-true}
        ROADMAP_TASK_BOARD_PERSISTENCE: ${ROADMAP_TASK_BOARD_PERSISTENCE:-legacy}
        ROADMAP_TASK_BOARD_API_BASE: ${ROADMAP_TASK_BOARD_API_BASE:-/roadmap-task-board/api}
    image: ${PORTAL_IMAGE_PREFIX:-local/portal}-portal-web:${PORTAL_IMAGE_TAG:-dev}
    restart: unless-stopped
    ports:
      - "${PORTAL_HTTP_PORT:-8080}:80"
    depends_on:
      portal-api:
        condition: service_healthy
      roadmap-task-board-api:
        condition: service_healthy
    networks:
      - portal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  portal:
    driver: bridge

volumes:
  portal-artifacts:
  roadmap-task-board-data:
