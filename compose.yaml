name: ${PORTAL_STACK_NAME:-portal}

x-control-api-image: &control-api-image
  build:
    context: .
    dockerfile: deploy/images/control-api.Dockerfile
  image: ${PORTAL_IMAGE_PREFIX:-local/portal}-control-api:${PORTAL_IMAGE_TAG:-dev}

x-control-api-environment: &control-api-environment
  PORTAL_ENV: ${PORTAL_ENV:-local}
  AUTH_MODE: ${CONTROL_API_AUTH_MODE:-dev}
  DATABASE_URL: postgres://portal:portal@portal-postgres:5432/portal_control
  PORTAL_PUBLIC_ORIGIN: ${PORTAL_PUBLIC_ORIGIN:-http://localhost:8080}
  PORTAL_API_BASE_URL: http://portal-api:8000
  PLANNING_API_BASE_URL: http://roadmap-task-board-api:8000
  FEATURE_PROXY_PORTAL: ${CONTROL_API_FEATURE_PROXY_PORTAL:-true}
  FEATURE_PROXY_PLANNING: ${CONTROL_API_FEATURE_PROXY_PLANNING:-true}
  FEATURE_EXECUTION_EDGE: "false"
  FEATURE_EXECUTION_REALTIME_SSE: "false"
  FEATURE_EXECUTION_ANALYTICS_QUERY: "false"
  # PRE-IAM-03 endpoint is built but remains dark until product review.
  FEATURE_EXECUTION_COMMAND_CENTER_SNAPSHOT: "false"
  FEATURE_EXECUTION_COMMAND_RELAY: "false"
  INTERNAL_PRINCIPAL_SECRET: ${CONTROL_API_INTERNAL_PRINCIPAL_SECRET:-local-dev-principal-secret-0123456789}
  CLOUDFLARE_TEAM_DOMAIN: ${CLOUDFLARE_TEAM_DOMAIN:-}
  CLOUDFLARE_ACCESS_ISSUER: ${CLOUDFLARE_ACCESS_ISSUER:-}
  CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD:-}
  CLOUDFLARE_ACCESS_JWKS_URI: ${CLOUDFLARE_ACCESS_JWKS_URI:-}
  CLOUDFLARE_ALLOWED_EMAIL_DOMAIN: ${CLOUDFLARE_ALLOWED_EMAIL_DOMAIN:-azdag.com}
  QUERY_CURSOR_ACTIVE_KEY_ID: ${CONTROL_API_QUERY_CURSOR_ACTIVE_KEY_ID:-query-k1}
  QUERY_CURSOR_KEYS_JSON: ${CONTROL_API_QUERY_CURSOR_KEYS_JSON:-}
  QUERY_CURSOR_KEYS_FILE: ${CONTROL_API_QUERY_CURSOR_KEYS_FILE:-}
  QUERY_CURSOR_TTL_SECONDS: ${CONTROL_API_QUERY_CURSOR_TTL_SECONDS:-900}
  GOVERNANCE_APPLY_ACTIVE_KEY_ID: ${CONTROL_API_GOVERNANCE_APPLY_ACTIVE_KEY_ID:-governance-k1}
  GOVERNANCE_APPLY_KEYS_JSON: ${CONTROL_API_GOVERNANCE_APPLY_KEYS_JSON:-}
  GOVERNANCE_APPLY_KEYS_FILE: ${CONTROL_API_GOVERNANCE_APPLY_KEYS_FILE:-}
  GOVERNANCE_PLAN_TTL_SECONDS: ${CONTROL_API_GOVERNANCE_PLAN_TTL_SECONDS:-300}

x-control-api-hardening: &control-api-hardening
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=16m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  volumes:
    - ${CONTROL_API_SECRETS_DIR:-./runtime/control-api-secrets}:/run/secrets/control-api:ro

# This is the Portal monorepo entry point. `./scripts/portal up` builds every
# tracked module into one coherent stack with one public gateway.
services:
  portal-api:
    build:
      context: .
      dockerfile: deploy/images/portal-api.Dockerfile
    image: ${PORTAL_IMAGE_PREFIX:-local/portal}-portal-api:${PORTAL_IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      PORTAL_ARTIFACT_ROOT: /var/lib/portal/artifacts/runs
      PORTAL_ALPHA_IMPORT_ROOT: /var/lib/portal/artifacts/alpha-imports
      PORTAL_ALPHA_ARTIFACT_ROOT: /var/lib/portal/artifacts/alpha-inbox
      PORTAL_HISTORICAL_DATA_MODE: ${PORTAL_HISTORICAL_DATA_MODE:-disabled}
      HISTORICAL_MARKET_DATA_ROOT: /data
      PORTAL_CRYPTO_RESAMPLE_ENGINE: ${PORTAL_CRYPTO_RESAMPLE_ENGINE:-duckdb}
      PORTAL_SUMMARY_DEADLINE_MS: ${PORTAL_SUMMARY_DEADLINE_MS:-500}
      PORTAL_ENVIRONMENT: ${PORTAL_ENVIRONMENT:-research}
      PORTAL_PLANNING_SUMMARY_MODE: ${PORTAL_PLANNING_SUMMARY_MODE:-local}
      PORTAL_PLANNING_API_BASE_URL: http://roadmap-task-board-api:8000
      PORTAL_PLANNING_SUMMARY_TIMEOUT_MS: ${PORTAL_PLANNING_SUMMARY_TIMEOUT_MS:-500}
      PORTAL_PLANNING_SUMMARY_MAX_BYTES: ${PORTAL_PLANNING_SUMMARY_MAX_BYTES:-65536}
    volumes:
      - portal-artifacts:/var/lib/portal/artifacts
      - ${PORTAL_HISTORICAL_DATA_DIR:-./runtime/historical-market-data}:/data:ro
    group_add:
      - ${PORTAL_HMD_READER_GID:-10001}
    expose:
      - "8000"
    networks:
      - portal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # The feature stays embedded in the public web image. This private companion
  # service owns its SQLite state, audit log and Discord outbox only.
  roadmap-task-board-api:
    build:
      context: .
      dockerfile: deploy/images/roadmap-task-board-api.Dockerfile
    image: ${PORTAL_IMAGE_PREFIX:-local/portal}-roadmap-task-board-api:${PORTAL_IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      PORTAL_ENV: ${ROADMAP_TASK_BOARD_ENV:-development}
      PORTAL_DATABASE_PATH: /var/lib/roadmap-task-board/portal.db
      PORTAL_PUBLIC_URL: ${ROADMAP_TASK_BOARD_PUBLIC_URL:-http://localhost:8080/roadmap-task-board}
      PORTAL_DEFAULT_ACTOR: ${ROADMAP_TASK_BOARD_DEFAULT_ACTOR:-local-user}
      PORTAL_CORS_ORIGINS: ${ROADMAP_TASK_BOARD_CORS_ORIGINS:-}
      PORTAL_LOG_LEVEL: ${ROADMAP_TASK_BOARD_LOG_LEVEL:-INFO}
      DISCORD_WEBHOOK_URL: ${ROADMAP_TASK_BOARD_DISCORD_WEBHOOK_URL:-}
      LARK_WEBHOOK_URL: ${LARK_WEBHOOK_URL:-}
      LARK_WEBHOOK_SIGN_SECRET: ${LARK_WEBHOOK_SIGN_SECRET:-}
      LARK_MENTION_MAP: ${LARK_MENTION_MAP:-}
      PORTAL_NOTIFY_CHANNELS: ${PORTAL_NOTIFY_CHANNELS:-discord}
    volumes:
      - roadmap-task-board-data:/var/lib/roadmap-task-board
    expose:
      - "8000"
    networks:
      - portal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  portal-web:
    build:
      context: .
      dockerfile: deploy/images/portal-web.Dockerfile
      args:
        ROADMAP_TASK_BOARD_LOCAL_ONLY: ${ROADMAP_TASK_BOARD_LOCAL_ONLY:-false}
        ROADMAP_TASK_BOARD_PERSISTENCE: ${ROADMAP_TASK_BOARD_PERSISTENCE:-v1}
        ROADMAP_TASK_BOARD_API_BASE: ${ROADMAP_TASK_BOARD_API_BASE:-/roadmap-task-board/api}
    image: ${PORTAL_IMAGE_PREFIX:-local/portal}-portal-web:${PORTAL_IMAGE_TAG:-dev}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORTAL_HTTP_PORT:-8080}:80"
    environment:
      # U10 façade wire: control-api:4000 routes every /api/ (except health,
      # ready and SSE) through the auth/RBAC BFF. Rollback in one line:
      # PORTAL_WEB_UPSTREAM=portal-api:8000.
      PORTAL_WEB_UPSTREAM: ${PORTAL_WEB_UPSTREAM:-control-api:4000}
    depends_on:
      portal-api:
        condition: service_healthy
      control-api:
        condition: service_healthy
      roadmap-task-board-api:
        condition: service_healthy
    networks:
      - portal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # One-shot schema owner. node-pg-migrate uses its PostgreSQL advisory lock,
  # so API replicas never race migrations during a rollout.
  control-api-migrate:
    <<: [*control-api-image, *control-api-hardening]
    restart: "no"
    command: ["./node_modules/.bin/node-pg-migrate", "-m", "migrations", "up"]
    environment: *control-api-environment
    depends_on:
      portal-postgres:
        condition: service_healthy
    networks:
      - portal

  # Idempotently creates INVITED identities after the schema exists. It never
  # prints activation credentials; that remains an explicit operator command.
  control-api-bootstrap:
    <<: [*control-api-image, *control-api-hardening]
    restart: "no"
    command: ["node", "dist/cli/bootstrap.js", "--file", "bootstrap-users.yaml"]
    environment: *control-api-environment
    depends_on:
      control-api-migrate:
        condition: service_completed_successfully
    networks:
      - portal

  # U07/U10 Control API. It only starts after schema/bootstrap jobs complete;
  # the long-running process never owns deployment-time mutations.
  control-api:
    <<: [*control-api-image, *control-api-hardening]
    restart: unless-stopped
    environment: *control-api-environment
    depends_on:
      control-api-bootstrap:
        condition: service_completed_successfully
    expose:
      - "4000"
    networks:
      - portal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/control/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # U07 identity datastore: private, SQL-first, no public port.
  portal-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal_control
    volumes:
      - portal-postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - portal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal_control"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # U11 durable job/event broker: private JetStream, no public port.
  portal-nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-m", "8222", "-sd", "/var/lib/nats"]
    volumes:
      - portal-nats-data:/var/lib/nats
    expose:
      - "4222"
      - "8222"
    networks:
      - portal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # U11 local/CI immutable object storage (S3-compatible). The production
  # provider stays ADR-004 owner decision.
  portal-minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: portal
      MINIO_ROOT_PASSWORD: portal-dev-only
    volumes:
      - portal-minio-data:/data
    expose:
      - "9000"
    networks:
      - portal
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # U11 durable Quant worker: same portal-api image, non-root, consumes
  # QUANT_JOBS and finalizes content-addressed bundles.
  quant-worker-py:
    image: ${PORTAL_IMAGE_PREFIX:-local/portal}-portal-api:${PORTAL_IMAGE_TAG:-dev}
    restart: unless-stopped
    command: ["python", "-m", "portal_api.workers.durable_worker_main"]
    environment:
      NATS_URL: nats://portal-nats:4222
      PORTAL_ARTIFACT_ROOT: /var/lib/portal/artifacts/runs
      PORTAL_ALPHA_IMPORT_ROOT: /var/lib/portal/artifacts/alpha-imports
      PORTAL_ALPHA_ARTIFACT_ROOT: /var/lib/portal/artifacts/alpha-inbox
      PORTAL_HISTORICAL_DATA_MODE: disabled
      PORTAL_CRYPTO_RESAMPLE_ENGINE: ${PORTAL_CRYPTO_RESAMPLE_ENGINE:-duckdb}
      PORTAL_WORKER_LEASE_SECONDS: ${PORTAL_WORKER_LEASE_SECONDS:-60}
      PORTAL_WORKER_GRACE_SECONDS: ${PORTAL_WORKER_GRACE_SECONDS:-10}
    volumes:
      - portal-artifacts:/var/lib/portal/artifacts
    depends_on:
      portal-nats:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - portal

networks:
  portal:
    driver: bridge

volumes:
  portal-artifacts:
  roadmap-task-board-data:
  portal-postgres-data:
  portal-nats-data:
  portal-minio-data:
