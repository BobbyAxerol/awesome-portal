name: ${PORTAL_STACK_NAME:-portal}

# This is the integration entry point. Each image is built from the checked-out
# source under apps/, so `./scripts/portal up` starts one coherent portal stack.
services:
  quantbt-portal-api:
    build:
      context: .
      dockerfile: deploy/images/quantbt-portal-api.Dockerfile
    image: ${PORTAL_IMAGE_PREFIX:-local/portal}-quantbt-portal-api:${PORTAL_IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      PORTAL_ARTIFACT_ROOT: /var/lib/portal/artifacts/runs
      PORTAL_CRYPTO_DATA_ROOT: /opt/portal/market-data
      PORTAL_CRYPTO_RESAMPLE_ENGINE: ${PORTAL_CRYPTO_RESAMPLE_ENGINE:-duckdb}
    volumes:
      - portal-artifacts:/var/lib/portal/artifacts
      - ${PORTAL_MARKET_DATA_DIR:-./runtime/market-data}:/opt/portal/market-data:ro
    expose:
      - "8000"
    networks:
      - portal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  quantbt-portal-web:
    build:
      context: .
      dockerfile: deploy/images/quantbt-portal-web.Dockerfile
    image: ${PORTAL_IMAGE_PREFIX:-local/portal}-quantbt-portal-web:${PORTAL_IMAGE_TAG:-dev}
    restart: unless-stopped
    ports:
      - "${PORTAL_HTTP_PORT:-8080}:80"
    depends_on:
      quantbt-portal-api:
        condition: service_healthy
    networks:
      - portal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  portal:
    driver: bridge

volumes:
  portal-artifacts:
