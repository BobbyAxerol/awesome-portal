<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accounts — V2</title><link rel="stylesheet" href="kit.css">
<style>
[hidden]{display:none!important}.stack>*{min-width:0}
.tool{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tool .grow{flex:1}select.btn{appearance:auto;padding:5px 8px;font:500 12px/18px var(--font-mono)}
tr.row{cursor:pointer}tr.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}.sub2{font-size:12px;line-height:16px;color:var(--ink-faint);white-space:normal}.w2{display:block;font-size:11px;line-height:14px;color:var(--ink-faint);white-space:normal}
.dh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.dh b{font:600 15px/22px var(--font-sans)}.sec{margin:16px 0 6px;font:500 11px/16px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.drawer table td{height:28px;padding:4px 0;white-space:normal}.drawer table td.n{padding-right:0;white-space:nowrap}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:flex-start}.acts>div{display:flex;flex-direction:column}
.den{min-height:260px;display:grid;place-items:center;text-align:center}.den b{font:600 15px/22px var(--font-sans)}.pager{padding:10px 12px;font-size:12px;color:var(--ink-faint)}
.sk{height:14px;background:var(--cell);margin:8px 0}
</style></head>
<body data-page="Accounts" data-nav="accounts" data-crumb="Execution / Accounts">
<main><div class="stack">
<div class="panel den" data-roles="researcher reviewer"><div><b>You can't open this page.</b><div class="na" style="margin:4px 0 12px">Accounts are not part of your role.</div><a href="access.html#see">See what you can access</a></div></div>

<div class="stack" data-roles="manager operator">
<div class="mast"><div><h1>Accounts</h1><div class="sub">Venue bindings and the sleeves on them</div></div>
 <div class="ctrls"><span class="chipx"><span class="dot warn" data-data="ok"></span><span class="dot mute" data-data="nq"></span><span data-data="ok">Stale 14m</span><span data-data="nq">Identity only</span></span></div></div>
<div class="banner" data-data="nq">Source not qualified. Equity and headroom are not available.</div>
<div><div class="tabs" id="lens" role="tablist"></div>
<div class="tool"><input class="search" id="q" placeholder="Search binding or account" aria-label="Search"><select class="btn" id="fv" aria-label="Venue"><option value="">Venue: all</option><option>Binance</option><option>OKX</option><option>Bybit</option></select><select class="btn" id="fc" aria-label="Credential"><option value="">Credential: all</option><option value="ok">Synced</option><option value="bad">Needs attention</option></select><span class="grow"></span><span id="exp"></span></div>
<div class="tool" style="margin-top:8px" id="chips"></div></div>
<div class="panel" style="padding:0"><div class="tw" id="tbl"></div><div class="pager" id="pg"></div></div>
<aside class="drawer dock" id="dr" hidden></aside>
</div>
</div></main>
<script src="kit.js"></script>
<script>
var S=KIT.state;function $(s){return document.querySelector(s)}function $$(s){return[].slice.call(document.querySelectorAll(s))}
/* id, name, venue, account, sleeves, env, state, credential(ok|stale|bad|na), equity, virtual, updated(min), unit */
var B=[
["b1","Binance main","Binance","Binance-02 sleeve",3,"real","Active","ok",412880.25,197500,14,"USDT"],
["b2","Binance sub","Binance","Binance-03 sleeve",2,"real","Active","stale",null,120000,180,"USDT"],
["b3","OKX main","OKX","OKX-01 sleeve",1,"real","Active","bad",85000,92400,35,"USDT"],
["b4","Paper simulator","Binance","Paper-sim-01",2,"paper","Active","ok",null,100000,3,"SIM"],
["b5","Binance testnet","Binance","Testnet-01",1,"testnet","Active","ok",10000,8100,6,"USDT"],
["b6","Bybit main","Bybit","Bybit-01 sleeve",1,"real","Suspended","na",null,null,null,"USDT"]];
var V={lens:"all",q:"",v:"",c:"",sel:null,loading:true};
function nq(){return S.data==="nq"}function fm(v){return KIT.fmt(v,2)}
var CF={ok:["ok","Synced"],stale:["stale","Sync delayed"],bad:["attention","Sync failed"],na:["na","Not available"]};
function cf(b){var c=nq()?"na":b[7];return KIT.flag(CF[c][0],CF[c][1])}
function ver(b){if(nq()||b[8]==null||b[9]==null)return KIT.flag("na","Not available");return b[9]<=b[8]?KIT.flag("ok","Within physical"):KIT.flag("rejected","Exceeded")}
function issue(b){return b[7]==="bad"||b[7]==="stale"||(b[8]!=null&&b[9]!=null&&b[9]>b[8])||b[7]==="na"}
function inLens(b){var l=V.lens;return l==="all"||(l==="issues"&&issue(b))||(l==="real"&&b[5]==="real")||l===b[5]}
function rows(){var q=V.q.trim().toLowerCase();return B.filter(function(b){return inLens(b)&&(!q||(b[1]+" "+b[3]).toLowerCase().indexOf(q)>=0)&&(!V.v||b[2]===V.v)&&(!V.c||(V.c==="ok"?b[7]==="ok":b[7]!=="ok"))})}
function cnt(l){return B.filter(function(b){var s=V.lens;V.lens=l;var r=inLens(b);V.lens=s;return r}).length}
function age(m){return m==null||nq()?'<span class="na">Not available</span>':(m>=60?Math.round(m/60)+" h ago":m+" min ago")}
function ageW(b){return b[10]>=30?'<span class="dot warn"></span>':'<span class="dot"></span>'}
function eq(b){return b[8]==null||nq()?'<span class="na">Not available</span><span class="w2">'+(b[5]==="paper"?"Simulated: no venue":"Venue report not published")+'</span>':fm(b[8])+' <small class="na">'+b[11]+'</small>'}
function virt(b){if(b[9]==null||nq())return'<span class="na">Not available</span><span class="w2">'+(nq()?'Source not qualified':'Binding suspended')+'</span>';var hr=b[8]==null?null:b[8]-b[9];return fm(b[9])+' <small class="na">'+b[11]+'</small><span class="w2">Headroom '+(hr==null?'Not available':(hr<0?'<span class="neg">'+fm(hr)+'</span>':fm(hr)))+'</span>'}
function drawLens(){var T=[["all","All"],["issues","Issues"],["real","Real-funded"],["paper","Paper"],["testnet","Testnet"]];$("#lens").innerHTML=T.map(function(t){return'<button role="tab" data-l="'+t[0]+'" aria-selected="'+(V.lens===t[0])+'">'+t[1]+' <span class="mono" style="color:var(--ink-faint)">'+cnt(t[0])+'</span></button>'}).join("")}
function drawChips(){var c=[];if(V.lens!=="all")c.push(["lens",V.lens==="real"?"Real-funded":V.lens[0].toUpperCase()+V.lens.slice(1),"lens"]);if(V.v)c.push(["venue",V.v,"v"]);if(V.c)c.push(["credential",V.c==="ok"?"Synced":"Needs attention","c"]);if(V.q)c.push(["search",V.q,"q"]);
 var u="?lens="+V.lens+(V.v?"&venue="+V.v:"")+(V.c?"&credential="+V.c:"");$("#chips").innerHTML=c.map(function(x){return'<span class="chipx">'+x[0]+': '+x[1]+' <button class="btn" style="padding:0 6px;border:0" data-x="'+x[2]+'" aria-label="Clear '+x[0]+'">✕</button></span>'}).join(" ")+(c.length?' <a href="#" id="clr">Clear all</a>':'')+' <details style="margin-left:auto"><summary>URL</summary><span class="mono" style="font-size:11px;color:var(--ink-faint)">'+u+'</span></details>'}
function drawTable(){var el=$("#tbl");
 if(V.loading){el.innerHTML='<div style="padding:16px" aria-busy="true"><div class="na">Loading accounts…</div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>';$("#pg").textContent="";return}
 var L=rows();
 if(!L.length){el.innerHTML='<div class="empty" style="min-height:160px;text-align:center">'+(V.lens==="all"&&!V.q&&!V.v&&!V.c?'No bindings yet.':'No bindings match these filters.<br><a href="#" id="clr2">Clear all</a>')+'</div>';$("#pg").textContent="Showing 0 of "+B.length+" authorized";return}
 el.innerHTML='<table class="cards"><thead><tr><th>Binding · Venue</th><th>Account</th><th>State</th><th>Credential</th><th class="n">Physical equity</th><th class="n">Σ Virtual · Headroom</th><th>Check</th><th>Updated</th></tr></thead><tbody>'+L.map(function(b){
  return'<tr class="row'+(V.sel===b[0]?" sel":"")+'" data-id="'+b[0]+'" tabindex="0"><td data-l="Binding"><b>'+b[1]+'</b><div class="sub2">'+b[2]+' · '+({real:"Real-funded",paper:"Paper",testnet:"Testnet"})[b[5]]+'</div></td><td data-l="Account"><a href="account.html">'+b[3]+'</a><div class="sub2">'+b[4]+' sleeve'+(b[4]>1?"s":"")+'</div></td><td data-l="State">'+(b[6]==="Active"?KIT.flag("ok","Active"):KIT.flag("paused",b[6]))+'</td><td data-l="Credential">'+cf(b)+'</td><td class="n" data-l="Physical equity">'+eq(b)+'</td><td class="n" data-l="Σ Virtual">'+virt(b)+'</td><td data-l="Check">'+ver(b)+'</td><td data-l="Updated">'+(b[10]==null||nq()?age(null):ageW(b)+age(b[10]))+'</td></tr>'}).join("")+'</tbody></table>';
 $("#pg").textContent="Showing "+L.length+" of "+B.length+" authorized"}
function find(id){for(var i=0;i<B.length;i++)if(B[i][0]===id)return B[i]}
function open(id){V.sel=id;var b=find(id),d=$("#dr"),n=nq(),hr=b[8]==null||b[9]==null?null:b[8]-b[9];
 d.innerHTML='<div class="ph">Binding <a href="#" class="r" data-close>Close</a></div><div class="dh"><div><b>'+b[1]+'</b><div class="sub2">'+b[2]+' · '+b[3]+'</div></div>'+cf(b)+'</div>'
 +'<div class="sec">Binding facts</div><table><tbody><tr><td>Native account</td><td class="n">'+(n?'<span class="na">Not available</span>':'Sub-account …4f2a')+'</td></tr><tr><td>Product</td><td class="n">'+(n?'<span class="na">Not available</span>':b[5]==="paper"?"Simulated":"USDT-M futures · hedge")+'</td></tr><tr><td>Margin mode</td><td class="n">'+(n||b[5]==="paper"?'<span class="na">Not available</span>':"Cross")+'</td></tr><tr><td>Environment proof</td><td class="n">'+(n?'<span class="na">Not available</span>':b[5]==="real"?"Mainnet · 17 Oct 09:12Z":b[5]==="testnet"?"Testnet · 17 Oct 09:12Z":"Simulated")+'</td></tr><tr><td>Sleeves on it</td><td class="n">'+b[4]+'</td></tr></tbody></table>'
 +'<div class="sec"><span>Capital invariant</span> · Σ virtual ≤ physical</div><table><tbody><tr><td>Physical equity</td><td class="n">'+(b[8]==null||n?'<span class="na">Not available</span>':fm(b[8])+' '+b[11])+'</td></tr><tr><td>Σ virtual</td><td class="n">'+(b[9]==null||n?'<span class="na">Not available</span>':fm(b[9])+' '+b[11])+'</td></tr><tr><td>Headroom</td><td class="n">'+(hr==null||n?'<span class="na">Not available</span>':hr<0?'<span class="neg">'+fm(hr)+'</span>':fm(hr))+'</td></tr><tr><td>Verdict</td><td class="n">'+ver(b)+'</td></tr></tbody></table>'
 +'<div class="acts"><a class="btn pri" href="account.html">Open account</a><a class="btn" href="account.html?view=physical">Physical binding</a>'+(S.role==="manager"?'<div><a class="btn" href="admin.html">Rotate credential</a><span class="why">Opens an admin action</span></div>':'<div>'+KIT.disabled("Rotate credential","noGrant")+'</div>')+'</div>'
 +'<details><summary>Provenance</summary><div class="mono sub2">binance_main_01 · sync '+(b[7]==="ok"?"SYNC_SYNCED":"not synced")+'</div></details>';
 d.hidden=false;render(true)}
function close(){V.sel=null;$("#dr").hidden=true;render(true)}
function render(){drawLens();drawChips();drawTable();$("#exp").innerHTML=KIT.disabled("Export","noExport")}
KIT.on(function(){V.sel=null;$("#dr").hidden=true;V.loading=true;render();setTimeout(function(){V.loading=false;render()},250)});
document.addEventListener("click",function(e){var t;
 if(t=e.target.closest("#lens [data-l]")){V.lens=t.getAttribute("data-l");V.sel=null;$("#dr").hidden=true;render();return}
 if(t=e.target.closest("[data-x]")){var k=t.getAttribute("data-x");if(k==="lens")V.lens="all";else V[k]="";$("#q").value=V.q;$("#fv").value=V.v;$("#fc").value=V.c;render();return}
 if(e.target.id==="clr"||e.target.id==="clr2"){e.preventDefault();V.lens="all";V.q=V.v=V.c="";$("#q").value="";$("#fv").value=$("#fc").value="";render();return}
 if(t=e.target.closest("[data-close]")){e.preventDefault();close();return}
 if(t=e.target.closest("tr.row")){if(e.target.closest("a"))return;open(t.getAttribute("data-id"))}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("#dr")&&!$("#dr").hidden)close();if(e.key==="Enter"&&e.target.matches&&e.target.matches("tr.row"))open(e.target.getAttribute("data-id"))});
$("#q").addEventListener("input",function(e){V.q=e.target.value;render()});$("#fv").addEventListener("change",function(e){V.v=e.target.value;render()});$("#fc").addEventListener("change",function(e){V.c=e.target.value;render()});
</script></body></html>
