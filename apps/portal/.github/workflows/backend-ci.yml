name: Backend CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Verify protected strategy
        run: sha256sum -c strategy/PROTECTED_SHA256
      - name: Test backend
        run: python -m pytest -c backend/pyproject.toml backend/tests
      - name: Compile service package
        run: python -m compileall -q backend/src strategy
