[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portal-api"
version = "0.1.0"
description = "Audit-first backend for the QuantBT backtest portal prototype"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "BobbyAxerol", email = "vugioan11022002@gmail.com" }]
dependencies = [
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "minio>=7.2,<8",
  "nats-py>=2.10,<3",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<25",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.9,<1",
  "quantbt-engine[optimization]==1.0.8",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]
historical-data = [
  "primus-historical-market-data==0.1.0rc3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".."]
addopts = "-q"
