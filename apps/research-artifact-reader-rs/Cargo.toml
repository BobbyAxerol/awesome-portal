[package]
name = "research-artifact-reader"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Research-only bounded Parquet artifact reader foundation"

[dependencies]
arrow-array = "53.4.1"
arrow-schema = "53.4.1"
base64 = "0.22.1"
chrono = "0.4.39"
hmac = "0.12.1"
parquet = { version = "53.4.1", features = ["arrow"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
thiserror = "2.0.12"

[dev-dependencies]
tempfile = "3.14.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
