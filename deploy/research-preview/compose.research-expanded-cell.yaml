# Expansion qualification custody. Do not reuse any earlier proof volume.
services:
  portal-api:
    environment:
      # Candidate permission is exact and local; ordinary preview/production
      # never inherits this owner-cell override.
      PORTAL_ENV: local
volumes:
  portal-artifacts:
    name: portal-research-expanded-${P23_VOLUME_EDITION:-20261006}-artifacts
  portal-postgres-data:
    name: portal-research-expanded-${P23_VOLUME_EDITION:-20261006}-postgres
  portal-nats-data:
    name: portal-research-expanded-${P23_VOLUME_EDITION:-20261006}-nats
  roadmap-task-board-data:
    name: portal-research-expanded-${P23_VOLUME_EDITION:-20261006}-roadmap
