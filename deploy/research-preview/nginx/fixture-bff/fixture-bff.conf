# FIXTURE_LAB lane. NOT acceptance evidence.
#
# Server-context fragment, mounted at /etc/nginx/fixture/ by
# deploy/research-preview/compose.fixture-bff.yaml and pulled in by the one
# `include /etc/nginx/fixture/*.conf;` line in deploy/nginx/portal.conf (an empty include, so every
# stack without this overlay renders exactly the configuration it had before).
#
# Two things, nothing else:
#   1. the locations below send the Execution V2 reads AND the shell bootstrap (the sign-in state,
#      the registry, the links, the summary) to the fixture BFF
#      (apps/portal/fixture-bff/ROUTES.md, "What an nginx must send here"), so the preview works with
#      no Control API at all. Every other /api/ path goes through the blocks in portal.conf to
#      PORTAL_WEB_UPSTREAM, which compose.fixture-bff.yaml points at the fixture BFF itself (so it is
#      refused there, 404) unless FIXTURE_WEB_UPSTREAM names a Control API;
#   2. an unmissable banner on every HTML document portal-web serves.
#
# These locations skip the Control API's session check on purpose: the fixture server answers
# synthetic data only and never reads a header or mints a session. Turn the overlay off to get the
# real reads back.

# ── 1. fixture locations ────────────────────────────────────────────────────

# 1a. The shell bootstrap. portal.conf owns `location ^~ /api/auth/` (an identical prefix here would be a
# duplicate and stop nginx), so the auth routes are listed one by one, from apps/control-api's AuthController:
# the one the fixture BFF answers (context) and the four it must REFUSE, so that while the lane is on a sign-in,
# sign-out, password change or CSRF read can never reach the real Control API and mint or end a real session.
# `gzip off` keeps the auth responses uncompressed, exactly as portal.conf does for /api/auth/.
location = /api/auth/context {
    gzip off;
    include /etc/nginx/fixture/proxy.inc;
}

location = /api/auth/csrf {
    gzip off;
    include /etc/nginx/fixture/proxy.inc;
}

location = /api/auth/login {
    gzip off;
    include /etc/nginx/fixture/proxy.inc;
}

location = /api/auth/change-password {
    gzip off;
    include /etc/nginx/fixture/proxy.inc;
}

location = /api/auth/logout {
    gzip off;
    include /etc/nginx/fixture/proxy.inc;
}

# The registry, links and summary the shell reads. A prefix, so /api/v1/portal/capabilities and anything else
# under it is refused by the fixture BFF (404) rather than falling through to the Control API.
location ^~ /api/v1/portal/ {
    include /etc/nginx/fixture/proxy.inc;
}

# 1b. The Execution V2 reads.

location ^~ /api/v1/execution/ {
    include /etc/nginx/fixture/proxy.inc;
}

location = /api/admin/access/self {
    include /etc/nginx/fixture/proxy.inc;
}

# Exact matches. The Access screen's Manage grants tab reads /api/admin/profile-access (the grant matrix) and
# /api/admin/profile-access/activity; on this FIXTURE lane the fixture BFF answers both (WP-E, FIXTURE_LAB), so a
# review of Access does not say "Could not read the access policy". Only exact paths are routed here; anything else
# under /api/admin/ stays real unless it is listed below.
location = /api/admin/profile-access {
    include /etc/nginx/fixture/proxy.inc;
}

location = /api/admin/profile-access/activity {
    include /etc/nginx/fixture/proxy.inc;
}

location = /api/admin/profile-access/v2/effective {
    include /etc/nginx/fixture/proxy.inc;
}

# The four advisory self reads (also exact: the fixture BFF answers them from the canonical access fixture).
location = /api/admin/profile-access/v2/self-navigation {
    include /etc/nginx/fixture/proxy.inc;
}

location = /api/admin/profile-access/v2/eligibility {
    include /etc/nginx/fixture/proxy.inc;
}

location = /api/admin/profile-access/v2/eligibility/batch {
    include /etc/nginx/fixture/proxy.inc;
}

location = /api/admin/profile-access/v2/self-context {
    include /etc/nginx/fixture/proxy.inc;
}

location = /api/admin/accounts {
    include /etc/nginx/fixture/proxy.inc;
}

location ^~ /api/admin/accounts/ {
    include /etc/nginx/fixture/proxy.inc;
}

# The New request alpha picker reads the Run Library list (WP-E, FIXTURE_LAB). Exact path only: every other
# /api/v1/quantbt/ read stays real.
location = /api/v1/quantbt/runs {
    include /etc/nginx/fixture/proxy.inc;
}

location = /api/admin/step-up {
    include /etc/nginx/fixture/proxy.inc;
}

# The lane marker and the health check (/__fixture/lane, /__fixture/healthz).
location ^~ /__fixture/ {
    include /etc/nginx/fixture/proxy.inc;
}

# ── 2. the banner ───────────────────────────────────────────────────────────
#
# sub_filter rewrites text/html only (the default type) and is inherited by every location of this
# server that sets none of its own, so the login page, every SPA route and the standalone Roadmap
# & Task Board document all carry it. The stylesheet is a same-origin file, not an inline <style>
# or a style attribute, so it stays valid under a CSP that forbids inline styles. The banner is a
# plain element with no control: nothing can dismiss it.
#
# The documents are the files nginx serves from disk (SPA fallbacks end in /index.html, whose
# Cache-Control is no-store), so they are never compressed by an upstream and sub_filter can see
# the markup.
sub_filter_types text/html;
sub_filter_once on;
sub_filter '</head>' '<link rel="stylesheet" href="/__fixture-banner.css"></head>';
sub_filter '<body>' '<body><div id="fixture-banner" role="note">FIXTURE DATA - sample data for UI/UX review, not real data, not acceptance evidence</div>';

# The banner stylesheet. `return` serves it from the configuration itself: no file for the nginx
# worker to read, so a checkout with restrictive permissions cannot make it 403.
#
# --fixture-banner-h is the height the banner reserves (one line wide, up to three lines at phone
# width). It is applied as body padding-top, and the few sticky/fixed offsets that start at the top
# of the viewport are moved down by it so the app's top bar is never covered.
location = /__fixture-banner.css {
    default_type text/css;
    add_header Cache-Control "no-store" always;
    add_header X-Fixture-Overlay on always;
    return 200 ':root { --fixture-banner-h: 28px; --exec-dock-top: calc(52px + var(--fixture-banner-h)); }
@media (max-width: 720px) { :root { --fixture-banner-h: 52px; } }
body { padding-top: var(--fixture-banner-h); }
#fixture-banner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 2147483647;
  box-sizing: border-box; height: var(--fixture-banner-h);
  display: flex; align-items: center; justify-content: center;
  padding: 0 8px; margin: 0;
  background: #ffd400; color: #111111; border-bottom: 2px solid #111111;
  font: 600 12px/14px system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  letter-spacing: 0; text-align: center; text-transform: none;
  user-select: none;
}
@media (max-width: 720px) { #fixture-banner { font-size: 11px; } }
body .portal-shell { min-height: calc(100vh - var(--fixture-banner-h)); }
body .portal-topbar { top: var(--fixture-banner-h); }
body .portal-rail { top: calc(var(--topbar-h) + var(--fixture-banner-h)); height: calc(100vh - var(--topbar-h) - var(--fixture-banner-h)); }
body .exec-oq-rail { top: calc(var(--topbar-h, 48px) + var(--fixture-banner-h)); max-height: calc(100vh - var(--topbar-h, 48px) - var(--fixture-banner-h)); }
body .exec-cli-drawer { top: var(--fixture-banner-h); max-height: calc(100vh - var(--fixture-banner-h)); }
';
}
