# Explicit Research-only last overlay. Marker + independently pinned private
# runtime.env are required by preview.sh. No installer runs during `up`.
# Source TLS/signers are NEW Research material, never copied stable secrets.
services:
  control-api:
    cpus: "2.0"
    mem_limit: 1536m
    pids_limit: 128
    environment:
      EXECUTION_READ_PROFILE: native_manager_review_v1
      EXECUTION_LOCAL_PROJECTION_WORKSPACE_ID: ${RESEARCH_NATIVE_WORKSPACE_ID:?Research native workspace is required}
      FEATURE_EXECUTION_LOCAL_PROJECTION: "true"
      FEATURE_EXECUTION_EDGE: "true"
      FEATURE_EXECUTION_CURRENT_SOURCE_PAPER: "true"
      EXECUTION_EDGE_PAPER_PROFILE_ID: PAPER_BINANCE_USDM
      EXECUTION_EDGE_PAPER_AUDIENCE: portal-execution-edge-paper
      EXECUTION_EDGE_PAPER_ORIGIN: ${RESEARCH_NATIVE_EDGE_ORIGIN:?Research-qualified Edge origin is required}
      EXECUTION_EDGE_PRIVATE_KEY_FILE: /run/secrets/research-native/edge-signing.pem
      EXECUTION_EDGE_CA_FILE: /run/secrets/research-native/edge-ca.pem
      EXECUTION_EDGE_CLIENT_CERT_FILE: /run/secrets/research-native/edge-client.pem
      EXECUTION_EDGE_CLIENT_KEY_FILE: /run/secrets/research-native/edge-client-key.pem
      EXECUTION_EDGE_SANDBOX_PROFILE_ID: ""
      EXECUTION_EDGE_LIVE_PROFILE_ID: ""
      FEATURE_EXECUTION_CURRENT_SOURCE_PAPER_DNSE: "false"
      FEATURE_EXECUTION_CURRENT_SOURCE_SANDBOX: "false"
      FEATURE_EXECUTION_CURRENT_SOURCE_LIVE: "false"
      FEATURE_EXECUTION_DURABLE_MIRROR: "false"
      FEATURE_EXECUTION_DURABLE_MIRROR_READS: "false"
      FEATURE_EXECUTION_REALTIME_SSE: "false"
      FEATURE_EXECUTION_ANALYTICS_QUERY: "false"
      FEATURE_EXECUTION_SHADOW_QUERY: "false"
      FEATURE_EXECUTION_PAPER_WORKBENCH_SHADOW: "false"
      FEATURE_EXECUTION_MARKET_CONTEXT: "false"
      FEATURE_EXECUTION_PUBLIC_MARKET_CANDLES: "false"
      FEATURE_EXECUTION_COMMAND_RELAY: "false"
      FEATURE_EXECUTION_LOCAL_R0_TASKS: "false"
      CONTROL_API_NATIVE_CORE_CONFIG_FILE: /run/secrets/research-native/runtime.json
      CONTROL_API_NATIVE_CORE_CONFIG_SHA256: ${RESEARCH_NATIVE_CORE_CONFIG_SHA256:?Pinned Research native manifest is required}
    volumes:
      - /home/bobby/.config/portal-research-preview/execution-native/runtime:/run/secrets/research-native:ro
