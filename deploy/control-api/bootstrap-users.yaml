# Bootstrap users for the Control API identity BFF (U07 / BAR-04).
#
# Idempotent: re-running seeds the same INVITED users and prints one-time
# activation credentials exactly once (never stored in plaintext). Roles
# follow the RBAC matrix: ADMIN for owners/operators, USER for analysts.
#
# Production must set the real identities via this file before the gateway
# wires the façade; local/dev defaults keep the research stack usable.
users:
  - username: bobby
    role: ADMIN
    # A4-D15 · the Portal owner anchor, established from protected bootstrap
    # input exactly as A4-1 requires and never from a public API.
    #
    # Without this marker `bootstrap.ts` filters `owner === true` to an empty
    # list, skips the claim entirely, and the deployment comes up with an
    # UNCLAIMED anchor — which fails closed, so Users & Access and
    # Profile & Access are shut to everyone including Bobby. A4-1 shipped the
    # anchor, the claim and the parser; this input was never given the marker.
    #
    # Idempotent and one-way: `claimOwner` leaves an already-held anchor
    # unchanged and refuses to move it to a different user, so re-running
    # bootstrap cannot reassign the Portal.
    owner: true
  - username: stan
    role: USER
  - username: thanhvuong
    role: USER