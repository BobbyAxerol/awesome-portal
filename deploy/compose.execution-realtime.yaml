# Opt-in SGP overlay for N08. The AWS Edge independently refuses startup unless
# its owner-approved activation manifest still matches the active N07 epoch.
services:
  control-api:
    environment:
      FEATURE_EXECUTION_EDGE: "true"
      FEATURE_EXECUTION_SHADOW_QUERY: "true"
      FEATURE_EXECUTION_PAPER_WORKBENCH_SHADOW: "true"
      FEATURE_EXECUTION_REALTIME_SSE: "true"
      EXECUTION_EDGE_ORIGIN: ${EXECUTION_EDGE_ORIGIN:?set the private AWS edge HTTPS origin}
      EXECUTION_EDGE_ENVIRONMENT: ${EXECUTION_EDGE_ENVIRONMENT:?paper, sandbox, or live}
      EXECUTION_EDGE_PRIVATE_KEY_FILE: /run/secrets/execution-edge/delegation-private-key.pem
      EXECUTION_EDGE_KEY_ID: ${EXECUTION_EDGE_KEY_ID:-execution-k1}
      EXECUTION_EDGE_DELEGATION_ISSUER: ${EXECUTION_EDGE_DELEGATION_ISSUER:-portal-control-api}
      EXECUTION_EDGE_DELEGATION_AUDIENCE: ${EXECUTION_EDGE_DELEGATION_AUDIENCE:?use an environment-specific audience}
      EXECUTION_EDGE_DELEGATION_TTL_SECONDS: ${EXECUTION_EDGE_DELEGATION_TTL_SECONDS:-45}
      EXECUTION_EDGE_CA_FILE: /run/secrets/execution-edge/edge-server-ca.crt
      EXECUTION_EDGE_CLIENT_CERT_FILE: /run/secrets/execution-edge/sgp-client.crt
      EXECUTION_EDGE_CLIENT_KEY_FILE: /run/secrets/execution-edge/sgp-client.key
      EXECUTION_EDGE_CONNECT_TIMEOUT_MS: ${EXECUTION_EDGE_CONNECT_TIMEOUT_MS:-3000}
      EXECUTION_EDGE_ANALYTICS_REQUEST_TIMEOUT_MS: ${EXECUTION_EDGE_ANALYTICS_REQUEST_TIMEOUT_MS:-5000}
      EXECUTION_EDGE_ANALYTICS_MAXIMUM_CONCURRENCY: ${EXECUTION_EDGE_ANALYTICS_MAXIMUM_CONCURRENCY:-64}
      EXECUTION_EDGE_ANALYTICS_MAXIMUM_QUEUE: ${EXECUTION_EDGE_ANALYTICS_MAXIMUM_QUEUE:-128}
      EXECUTION_EDGE_ANALYTICS_QUEUE_TIMEOUT_MS: ${EXECUTION_EDGE_ANALYTICS_QUEUE_TIMEOUT_MS:-250}
    volumes:
      - type: bind
        source: ${CONTROL_API_EXECUTION_EDGE_SECRET_DIRECTORY:?set the root-owned SGP edge secret directory}
        target: /run/secrets/execution-edge
        read_only: true
