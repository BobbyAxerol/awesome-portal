# Research Loop P11 optional progress/runtime overlay.
#
# Apply only after the base production compose and stable-runtime overlay.  It
# is intentionally inert by default: P11 needs the exact P10 producer, a
# shared durable artifact volume, matching private HMAC secret and a forward
# migration in the same approved change window.  This file publishes no port,
# creates no service, and cannot enable a browser route by itself.
services:
  control-api:
    environment:
      FEATURE_RESEARCH_RUN_PRODUCER: ${CONTROL_API_FEATURE_RESEARCH_RUN_PRODUCER:-false}
      FEATURE_RESEARCH_PROGRESS: ${CONTROL_API_FEATURE_RESEARCH_PROGRESS:-false}
      # P13 is a read-only same-origin Hub over already immutable terminal
      # receipts. It neither starts a worker nor changes P10/P11 flags.
      FEATURE_RESEARCH_EVIDENCE: ${CONTROL_API_FEATURE_RESEARCH_EVIDENCE:-false}
      FEATURE_RESEARCH_SPLIT: ${CONTROL_API_FEATURE_RESEARCH_SPLIT:-false}
      # P15 is a current-source reader over P10/P14 immutable facts only. It
      # does not activate a generic optimizer, a worker or artifact/Parquet
      # access. Keep false until its generated Screen-06 consumer is accepted.
      FEATURE_RESEARCH_SEARCH: ${CONTROL_API_FEATURE_RESEARCH_SEARCH:-false}
      # P16 verifies only Portal-retained P04/P10/P14 digests. It never starts
      # a source/worker/diagnostic path or reads source artifact bytes.
      FEATURE_RESEARCH_FREEZE: ${CONTROL_API_FEATURE_RESEARCH_FREEZE:-false}
      FEATURE_RESEARCH_REPLAY: ${CONTROL_API_FEATURE_RESEARCH_REPLAY:-false}
      # P18 is a Portal-local immutable report/export projection. This flag
      # only admits the reader and terminal-sidecar assembly; it never starts
      # the explicit export worker, QuantBT, an artifact reader or a source
      # connection. Keep dark until the generated Screen-09 consumer and
      # browser/print evidence are accepted.
      FEATURE_RESEARCH_REPORTS: ${CONTROL_API_FEATURE_RESEARCH_REPORTS:-false}
      RESEARCH_REPORT_EXPORT_MAXIMUM_BYTES: ${CONTROL_API_RESEARCH_REPORT_EXPORT_MAXIMUM_BYTES:-524288}
      RESEARCH_REPORT_EXPORT_LEASE_SECONDS: ${CONTROL_API_RESEARCH_REPORT_EXPORT_LEASE_SECONDS:-90}
      # P19 is a read-only, bounded attempt lineage projection. It does not
      # start a worker, mutation route, source transport, or promotion policy.
      FEATURE_RESEARCH_LINEAGE: ${CONTROL_API_FEATURE_RESEARCH_LINEAGE:-false}
      # P20 Compare reads only existing Portal-persisted requested/evidence/
      # split/current-source facts. It can compute one bounded exact-time
      # correlation locally, never starts QuantBT or changes selection,
      # governance, publication or Execution.
      FEATURE_RESEARCH_COMPARE: ${CONTROL_API_FEATURE_RESEARCH_COMPARE:-false}
      RESEARCH_PROGRESS_PRIVATE_TIMEOUT_MS: ${CONTROL_API_RESEARCH_PROGRESS_PRIVATE_TIMEOUT_MS:-1500}

  # The worker owns source journalling and the private, at-least-once callback.
  # It uses the existing portal-artifacts named volume from stable-runtime;
  # neither the browser nor a Trading System/Execution Edge service is added.
  quant-worker-py:
    environment:
      PORTAL_FEATURE_RESEARCH_RUN_PRODUCER: ${PORTAL_FEATURE_RESEARCH_RUN_PRODUCER:-false}
      PORTAL_FEATURE_RESEARCH_PROGRESS: ${PORTAL_FEATURE_RESEARCH_PROGRESS:-false}
      CONTROL_API_INTERNAL_URL: ${CONTROL_API_INTERNAL_URL:-http://control-api:4000}
      # Production base compose requires this value. The local fallback only
      # preserves the existing disposable-development default so `config -q`
      # can validate this dark overlay without inventing a secret file.
      INTERNAL_PRINCIPAL_SECRET: ${CONTROL_API_INTERNAL_PRINCIPAL_SECRET:-local-dev-principal-secret-0123456789}
      PORTAL_RESEARCH_PROGRESS_RELAY_TIMEOUT_SECONDS: ${PORTAL_RESEARCH_PROGRESS_RELAY_TIMEOUT_SECONDS:-1.5}
