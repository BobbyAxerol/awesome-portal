# Portal Postgres — common configuration / 4 GiB dev-stable baseline.
# UDB-01: preview.conf and p23.conf include this file and override the memory
# envelope. Never apply these 1 GiB shared buffers to the 900 MB P23 cgroup.
#
# Why this file exists: until now every Portal Postgres ran on the image defaults. On 2026-10-09 an Execution cache table held 81 GB of
# TOAST space while it contained 0 rows (see upgrade/upgrade_frontend_plan_hifi/hifi_execution_loop/HOTFIX_REQUEST_2026-10-09_POSTGRES_CACHE_BLOAT.md).
# These values are the starting point for a host of 8 cores / 32 GB shared by several stacks, with each Postgres container limited to a few GB.
# They were chosen from the measured failure, not from folklore; the soak test in the hotfix packet is what validates them.
#
# Mounted read-only at /etc/postgresql/portal.conf and selected with `postgres -c config_file=/etc/postgresql/portal.conf`.
# Values that need a restart are marked [restart]; everything else is reloadable (`select pg_reload_conf()`).

listen_addresses = '*'
max_connections = 100

# --- memory [restart for shared_buffers]
shared_buffers = 1GB                      # image default 128 MB
effective_cache_size = 3GB                # planner hint only; keep below the container memory limit
maintenance_work_mem = 256MB              # vacuum / index builds: fewer index passes on multi-GB tables (default 64 MB)
work_mem = 4MB                           # per sort/hash, not per connection
autovacuum_work_mem = 64MB               # per worker: do not inherit 256 MB × 4

# --- WAL / checkpoints (2 MiB JSONB writes made the default 1 GB max_wal_size checkpoint constantly)
max_wal_size = 4GB
min_wal_size = 256MB
checkpoint_timeout = 15min
wal_compression = on
log_checkpoints = on

# --- TOAST
default_toast_compression = lz4           # image default pglz; lz4 is compiled into postgres:16-alpine (checked)

# --- autovacuum: percentages of a table that may be dead before it is cleaned are too large for multi-GB tables
autovacuum = on
autovacuum_max_workers = 4                # [restart]
autovacuum_naptime = 5s                  # bounded cache TOAST churn, verified by UDB soak
autovacuum_vacuum_scale_factor = 0.05     # default 0.2
autovacuum_vacuum_insert_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.02    # default 0.1
autovacuum_vacuum_cost_limit = 1000       # default 200: the cleaner finishes a multi-GB table in minutes, not hours
log_autovacuum_min_duration = 1min        # default 10 min: a slow vacuum is now visible

# --- guard rails
idle_in_transaction_session_timeout = 60s # an idle open transaction pins the snapshot and blocks cleanup
log_min_duration_statement = 5s
track_io_timing = on

# --- statement statistics (the extension itself is created per database by an operator, never by an app migration)
shared_preload_libraries = 'pg_stat_statements'   # [restart]
pg_stat_statements.track = top
