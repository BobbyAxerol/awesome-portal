# UDB-02 private Portal-owned Execution preview, NOT Trading System PG.
include = '/etc/postgresql/portal.conf'
max_connections = 24
shared_buffers = 64MB
effective_cache_size = 192MB
work_mem = 1MB
hash_mem_multiplier = 1
maintenance_work_mem = 16MB
autovacuum_work_mem = 16MB
autovacuum_max_workers = 2
max_parallel_workers_per_gather = 0
temp_file_limit = 32MB
max_wal_size = 256MB
min_wal_size = 80MB
