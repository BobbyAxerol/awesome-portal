# UDB-01: shared preview PG, 1.5 GiB cgroup (not the P23 qualification profile).
include = '/etc/postgresql/portal.conf'
max_connections = 60
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 2MB
hash_mem_multiplier = 1
maintenance_work_mem = 64MB
autovacuum_work_mem = 32MB
autovacuum_max_workers = 2
max_parallel_workers_per_gather = 0
temp_file_limit = 128MB
max_wal_size = 1GB
min_wal_size = 80MB
