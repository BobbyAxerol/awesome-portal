# N13B same-origin Control API bridge to profile-isolated private Rust Edge
# runtimes. Including this overlay does not enable a profile by itself: each
# profile flag defaults false and its exact origin/profile/audience is checked
# by Control API before startup.
services:
  control-api:
    group_add:
      - "${PORTAL_RUNTIME_GID:?set the numeric portal-runtime group ID}"
    environment:
      FEATURE_EXECUTION_EDGE: "true"
      FEATURE_EXECUTION_CURRENT_SOURCE_PAPER: ${CONTROL_API_FEATURE_EXECUTION_CURRENT_SOURCE_PAPER:-false}
      # P4-D taxonomy (owner-approved 2026-09-03): DNSE/VN paper family.
      # Off until the Edge publishes the N13B origin for PAPER_DNSE_VNM.
      FEATURE_EXECUTION_CURRENT_SOURCE_PAPER_DNSE: ${CONTROL_API_FEATURE_EXECUTION_CURRENT_SOURCE_PAPER_DNSE:-false}
      FEATURE_EXECUTION_CURRENT_SOURCE_SANDBOX: ${CONTROL_API_FEATURE_EXECUTION_CURRENT_SOURCE_SANDBOX:-false}
      FEATURE_EXECUTION_CURRENT_SOURCE_LIVE: ${CONTROL_API_FEATURE_EXECUTION_CURRENT_SOURCE_LIVE:-false}
      # EDS-12 Portal-owned Market Context is independently opt-in even when
      # a profile is readable.  `data_layer` has no public-venue fallback:
      # it remains on the private Edge -> Source Proxy -> Data Layer path.
      FEATURE_EXECUTION_MARKET_CONTEXT: ${CONTROL_API_FEATURE_EXECUTION_MARKET_CONTEXT:-false}
      EXECUTION_MARKET_CANDLES_SOURCE: ${CONTROL_API_EXECUTION_MARKET_CANDLES_SOURCE:-venue_public}
      FEATURE_EXECUTION_COMMAND_RELAY: "false"
      EXECUTION_EDGE_PRIVATE_KEY_FILE: /run/secrets/execution-edge/delegation-private-key.pem
      EXECUTION_EDGE_KEY_ID: ${EXECUTION_EDGE_KEY_ID:-execution-k1}
      EXECUTION_EDGE_DELEGATION_ISSUER: ${EXECUTION_EDGE_DELEGATION_ISSUER:-portal-control-api}
      EXECUTION_EDGE_DELEGATION_TTL_SECONDS: ${EXECUTION_EDGE_DELEGATION_TTL_SECONDS:-45}
      EXECUTION_EDGE_CA_FILE: /run/secrets/execution-edge/edge-server-ca.crt
      EXECUTION_EDGE_CLIENT_CERT_FILE: /run/secrets/execution-edge/sgp-client.crt
      EXECUTION_EDGE_CLIENT_KEY_FILE: /run/secrets/execution-edge/sgp-client.key
      EXECUTION_EDGE_PAPER_ORIGIN: ${EXECUTION_EDGE_PAPER_ORIGIN:-}
      EXECUTION_EDGE_PAPER_PROFILE_ID: ${EXECUTION_EDGE_PAPER_PROFILE_ID:-}
      EXECUTION_EDGE_PAPER_AUDIENCE: ${EXECUTION_EDGE_PAPER_AUDIENCE:-}
      EXECUTION_EDGE_PAPER_DNSE_ORIGIN: ${EXECUTION_EDGE_PAPER_DNSE_ORIGIN:-}
      EXECUTION_EDGE_PAPER_DNSE_PROFILE_ID: ${EXECUTION_EDGE_PAPER_DNSE_PROFILE_ID:-}
      EXECUTION_EDGE_PAPER_DNSE_AUDIENCE: ${EXECUTION_EDGE_PAPER_DNSE_AUDIENCE:-}
      EXECUTION_EDGE_SANDBOX_ORIGIN: ${EXECUTION_EDGE_SANDBOX_ORIGIN:-}
      EXECUTION_EDGE_SANDBOX_PROFILE_ID: ${EXECUTION_EDGE_SANDBOX_PROFILE_ID:-}
      EXECUTION_EDGE_SANDBOX_AUDIENCE: ${EXECUTION_EDGE_SANDBOX_AUDIENCE:-}
      EXECUTION_EDGE_LIVE_ORIGIN: ${EXECUTION_EDGE_LIVE_ORIGIN:-}
      EXECUTION_EDGE_LIVE_PROFILE_ID: ${EXECUTION_EDGE_LIVE_PROFILE_ID:-}
      EXECUTION_EDGE_LIVE_AUDIENCE: ${EXECUTION_EDGE_LIVE_AUDIENCE:-}
      EXECUTION_EDGE_CONNECT_TIMEOUT_MS: ${EXECUTION_EDGE_CONNECT_TIMEOUT_MS:-3000}
      EXECUTION_EDGE_CURRENT_SOURCE_REQUEST_TIMEOUT_MS: ${EXECUTION_EDGE_CURRENT_SOURCE_REQUEST_TIMEOUT_MS:-5000}
      EXECUTION_EDGE_CURRENT_SOURCE_MAX_RESPONSE_BYTES: ${EXECUTION_EDGE_CURRENT_SOURCE_MAX_RESPONSE_BYTES:-2097152}
      EXECUTION_EDGE_CURRENT_SOURCE_MAXIMUM_CONCURRENCY: ${EXECUTION_EDGE_CURRENT_SOURCE_MAXIMUM_CONCURRENCY:-64}
      EXECUTION_EDGE_CURRENT_SOURCE_MAXIMUM_QUEUE: ${EXECUTION_EDGE_CURRENT_SOURCE_MAXIMUM_QUEUE:-128}
      EXECUTION_EDGE_CURRENT_SOURCE_QUEUE_TIMEOUT_MS: ${EXECUTION_EDGE_CURRENT_SOURCE_QUEUE_TIMEOUT_MS:-250}
      EXECUTION_EDGE_CURRENT_SOURCE_MAX_REQUESTS_PER_SECOND: ${EXECUTION_EDGE_CURRENT_SOURCE_MAX_REQUESTS_PER_SECOND:-15}
      EXECUTION_EDGE_CURRENT_SOURCE_MAXIMUM_PACE_WAIT_MS: ${EXECUTION_EDGE_CURRENT_SOURCE_MAXIMUM_PACE_WAIT_MS:-1000}
      # BE-R2-1: Portal-owned cleanup of recomputable, already-expired N21
      # cache rows. Disabled and dry-run by default; it has no source,
      # projection, command or browser-facing side effect.
      FEATURE_EXECUTION_SHARED_READ_CACHE_SWEEPER: ${CONTROL_API_FEATURE_EXECUTION_SHARED_READ_CACHE_SWEEPER:-false}
      EXECUTION_SHARED_READ_CACHE_SWEEPER_DRY_RUN: ${CONTROL_API_EXECUTION_SHARED_READ_CACHE_SWEEPER_DRY_RUN:-true}
      EXECUTION_SHARED_READ_CACHE_SWEEPER_INTERVAL_MS: ${CONTROL_API_EXECUTION_SHARED_READ_CACHE_SWEEPER_INTERVAL_MS:-60000}
      EXECUTION_SHARED_READ_CACHE_SWEEPER_STARTUP_JITTER_MS: ${CONTROL_API_EXECUTION_SHARED_READ_CACHE_SWEEPER_STARTUP_JITTER_MS:-5000}
      EXECUTION_SHARED_READ_CACHE_SWEEPER_MAX_RUNTIME_MS: ${CONTROL_API_EXECUTION_SHARED_READ_CACHE_SWEEPER_MAX_RUNTIME_MS:-2000}
      EXECUTION_SHARED_READ_CACHE_SWEEPER_BATCH_ROWS: ${CONTROL_API_EXECUTION_SHARED_READ_CACHE_SWEEPER_BATCH_ROWS:-128}
      EXECUTION_SHARED_READ_CACHE_SWEEPER_BATCH_BYTES: ${CONTROL_API_EXECUTION_SHARED_READ_CACHE_SWEEPER_BATCH_BYTES:-8388608}
      EXECUTION_SHARED_READ_CACHE_MAXIMUM_ROWS: ${CONTROL_API_EXECUTION_SHARED_READ_CACHE_MAXIMUM_ROWS:-20000}
      EXECUTION_SHARED_READ_CACHE_MAXIMUM_BYTES: ${CONTROL_API_EXECUTION_SHARED_READ_CACHE_MAXIMUM_BYTES:-268435456}
    volumes:
      - type: bind
        source: ${CONTROL_API_EXECUTION_EDGE_SECRET_DIRECTORY:?set the root-owned SGP edge secret directory}
        target: /run/secrets/execution-edge
        read_only: true
