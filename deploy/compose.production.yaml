name: ${PORTAL_STACK_NAME:-portal}

x-control-api-image: &control-api-image
  image: ${PORTAL_IMAGE_PREFIX:?Set PORTAL_IMAGE_PREFIX}-control-api:${PORTAL_IMAGE_TAG:?Set PORTAL_IMAGE_TAG}

x-control-api-environment: &control-api-environment
  PORTAL_ENV: ${CONTROL_API_PORTAL_ENV:-research}
  AUTH_MODE: ${CONTROL_API_AUTH_MODE:?Set CONTROL_API_AUTH_MODE (cloudflare_access_local_password)}
  DATABASE_URL: postgres://${PORTAL_CONTROL_DB_USER:-portal}:${PORTAL_CONTROL_DB_PASSWORD:?Set PORTAL_CONTROL_DB_PASSWORD}@portal-postgres:5432/${PORTAL_CONTROL_DB_NAME:-portal_control}
  PORTAL_PUBLIC_ORIGIN: ${PORTAL_PUBLIC_ORIGIN:?Set PORTAL_PUBLIC_ORIGIN (https://portal.primusspark.com)}
  PORTAL_API_BASE_URL: http://portal-api:8000
  PLANNING_API_BASE_URL: http://roadmap-task-board-api:8000
  FEATURE_PROXY_PORTAL: "true"
  FEATURE_PROXY_PLANNING: "true"
  # EX-BE-06 stays dark unless the opt-in execution-realtime overlay is used.
  FEATURE_EXECUTION_EDGE: "false"
  FEATURE_EXECUTION_REALTIME_SSE: "false"
  # EX-BE-07b remains dark until source parity/cross-cell qualification passes.
  FEATURE_EXECUTION_ANALYTICS_QUERY: "false"
  # PRE-IAM-03 remains dark in production until registry/source activation.
  FEATURE_EXECUTION_COMMAND_CENTER_SNAPSHOT: "false"
  INTERNAL_PRINCIPAL_SECRET: ${CONTROL_API_INTERNAL_PRINCIPAL_SECRET:?Set CONTROL_API_INTERNAL_PRINCIPAL_SECRET}
  QUERY_CURSOR_ACTIVE_KEY_ID: ${CONTROL_API_QUERY_CURSOR_ACTIVE_KEY_ID:-query-k1}
  QUERY_CURSOR_KEYS_JSON: '${CONTROL_API_QUERY_CURSOR_KEYS_JSON:?Set CONTROL_API_QUERY_CURSOR_KEYS_JSON}'
  GOVERNANCE_APPLY_ACTIVE_KEY_ID: ${CONTROL_API_GOVERNANCE_APPLY_ACTIVE_KEY_ID:-governance-k1}
  GOVERNANCE_APPLY_KEYS_JSON: '${CONTROL_API_GOVERNANCE_APPLY_KEYS_JSON:?Set CONTROL_API_GOVERNANCE_APPLY_KEYS_JSON}'
  GOVERNANCE_PLAN_TTL_SECONDS: ${CONTROL_API_GOVERNANCE_PLAN_TTL_SECONDS:-300}
  CLOUDFLARE_TEAM_DOMAIN: ${CLOUDFLARE_TEAM_DOMAIN:?Set CLOUDFLARE_TEAM_DOMAIN}
  CLOUDFLARE_ACCESS_ISSUER: ${CLOUDFLARE_ACCESS_ISSUER:?Set CLOUDFLARE_ACCESS_ISSUER}
  CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD:?Set CLOUDFLARE_ACCESS_AUD}
  CLOUDFLARE_ACCESS_JWKS_URI: ${CLOUDFLARE_ACCESS_JWKS_URI:?Set CLOUDFLARE_ACCESS_JWKS_URI}
  CLOUDFLARE_ALLOWED_EMAIL_DOMAIN: ${CLOUDFLARE_ALLOWED_EMAIL_DOMAIN:-azdag.com}

x-control-api-hardening: &control-api-hardening
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=16m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

# Image-only deployment definition. CI publishes images from the Portal
# monorepo. Provision .env.production on the host from .env.production.example;
# do not put deployment secrets in this repository.
services:
  portal-api:
    image: ${PORTAL_IMAGE_PREFIX:?Set PORTAL_IMAGE_PREFIX}-portal-api:${PORTAL_IMAGE_TAG:?Set PORTAL_IMAGE_TAG}
    restart: unless-stopped
    environment:
      PORTAL_ARTIFACT_ROOT: /var/lib/portal/artifacts/runs
      PORTAL_HISTORICAL_DATA_MODE: required
      HISTORICAL_MARKET_DATA_ROOT: /data
      PORTAL_CRYPTO_RESAMPLE_ENGINE: ${PORTAL_CRYPTO_RESAMPLE_ENGINE:-duckdb}
      PORTAL_PLANNING_SUMMARY_MODE: api
      PORTAL_PLANNING_API_BASE_URL: http://roadmap-task-board-api:8000
      PORTAL_PLANNING_SUMMARY_TIMEOUT_MS: ${PORTAL_PLANNING_SUMMARY_TIMEOUT_MS:-500}
      PORTAL_PLANNING_SUMMARY_MAX_BYTES: ${PORTAL_PLANNING_SUMMARY_MAX_BYTES:-65536}
    volumes:
      - portal-artifacts:/var/lib/portal/artifacts
      - ${PORTAL_HISTORICAL_DATA_DIR:?Set PORTAL_HISTORICAL_DATA_DIR}:/data:ro
    group_add:
      - ${PORTAL_HMD_READER_GID:?Set PORTAL_HMD_READER_GID}
    expose:
      - "8000"
    networks:
      - portal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  roadmap-task-board-api:
    image: ${PORTAL_IMAGE_PREFIX:?Set PORTAL_IMAGE_PREFIX}-roadmap-task-board-api:${PORTAL_IMAGE_TAG:?Set PORTAL_IMAGE_TAG}
    restart: unless-stopped
    environment:
      PORTAL_ENV: production
      PORTAL_DATABASE_PATH: /var/lib/roadmap-task-board/portal.db
      PORTAL_PUBLIC_URL: ${ROADMAP_TASK_BOARD_PUBLIC_URL:?Set ROADMAP_TASK_BOARD_PUBLIC_URL}
      PORTAL_DEFAULT_ACTOR: ${ROADMAP_TASK_BOARD_DEFAULT_ACTOR:-local-user}
      PORTAL_CORS_ORIGINS: ${ROADMAP_TASK_BOARD_CORS_ORIGINS:-}
      PORTAL_LOG_LEVEL: ${ROADMAP_TASK_BOARD_LOG_LEVEL:-INFO}
      DISCORD_WEBHOOK_URL: ${ROADMAP_TASK_BOARD_DISCORD_WEBHOOK_URL:-}
      LARK_WEBHOOK_URL: ${LARK_WEBHOOK_URL:-}
      LARK_WEBHOOK_SIGN_SECRET: ${LARK_WEBHOOK_SIGN_SECRET:-}
      LARK_MENTION_MAP: ${LARK_MENTION_MAP:-}
      PORTAL_NOTIFY_CHANNELS: ${PORTAL_NOTIFY_CHANNELS:-discord}
    volumes:
      - roadmap-task-board-data:/var/lib/roadmap-task-board
    expose:
      - "8000"
    networks:
      - portal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  portal-web:
    image: ${PORTAL_IMAGE_PREFIX:?Set PORTAL_IMAGE_PREFIX}-portal-web:${PORTAL_IMAGE_TAG:?Set PORTAL_IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORTAL_HTTP_PORT:-8080}:80"
    depends_on:
      portal-api:
        condition: service_healthy
      control-api:
        condition: service_healthy
      roadmap-task-board-api:
        condition: service_healthy
    environment:
      PORTAL_WEB_UPSTREAM: ${PORTAL_WEB_UPSTREAM:-control-api:4000}
    networks:
      - portal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  control-api-migrate:
    <<: [*control-api-image, *control-api-hardening]
    restart: "no"
    command: ["./node_modules/.bin/node-pg-migrate", "-m", "migrations", "up"]
    environment: *control-api-environment
    depends_on:
      portal-postgres:
        condition: service_healthy
    networks:
      - portal

  control-api-bootstrap:
    <<: [*control-api-image, *control-api-hardening]
    restart: "no"
    command: ["node", "dist/cli/bootstrap.js", "--file", "bootstrap-users.yaml"]
    environment: *control-api-environment
    depends_on:
      control-api-migrate:
        condition: service_completed_successfully
    networks:
      - portal

  control-api:
    <<: [*control-api-image, *control-api-hardening]
    restart: unless-stopped
    environment: *control-api-environment
    depends_on:
      control-api-bootstrap:
        condition: service_completed_successfully
    expose:
      - "4000"
    networks:
      - portal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/control/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  portal-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PORTAL_CONTROL_DB_USER:-portal}
      POSTGRES_PASSWORD: ${PORTAL_CONTROL_DB_PASSWORD:?Set PORTAL_CONTROL_DB_PASSWORD}
      POSTGRES_DB: ${PORTAL_CONTROL_DB_NAME:-portal_control}
    volumes:
      - portal-postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - portal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PORTAL_CONTROL_DB_USER:-portal} -d ${PORTAL_CONTROL_DB_NAME:-portal_control}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  portal:
    driver: bridge

volumes:
  portal-artifacts:
  roadmap-task-board-data:
  portal-postgres-data:
