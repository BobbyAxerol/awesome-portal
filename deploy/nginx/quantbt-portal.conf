server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API and SSE remain behind the same public origin as the React portal.
    location /api/ {
        proxy_pass http://quantbt-portal-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Independently tracked Roadmap & Task Board source, embedded into this
    # same web container. Keep the former route as a narrow compatibility alias.
    location = /migration {
        return 301 /roadmap-task-board/;
    }

    location = /migration/ {
        return 301 /roadmap-task-board/;
    }

    location = /roadmap-task-board {
        return 301 /roadmap-task-board/;
    }

    location ^~ /roadmap-task-board/ {
        try_files $uri $uri/ /roadmap-task-board/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
