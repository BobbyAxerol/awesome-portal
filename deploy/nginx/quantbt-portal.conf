server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API and SSE remain behind the same public origin as the React portal.
    location /api/ {
        proxy_pass http://quantbt-portal-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Independently tracked source, embedded into this same web container.
    location = /migration {
        return 301 /migration/;
    }

    location ^~ /migration/ {
        try_files $uri $uri/ /migration/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
