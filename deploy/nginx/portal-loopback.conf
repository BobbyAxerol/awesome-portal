# Portal loopback origin nginx template (guide §P0.25A.15).
#
# Loopback TLS only: the public entry point is the Cloudflare Tunnel. Nginx
# strips every spoofable identity header and forwards only the canonical
# Access assertion for the app to verify itself. Install as
# /etc/nginx/conf.d/portal-loopback.conf on the VPS after placing the Origin
# CA certificate and private key.

map $http_upgrade $portal_connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_cf_connecting_ip $portal_client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

upstream portal_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 127.0.0.1:443 ssl http2;
    server_name portal.primusspark.com;

    ssl_certificate     /etc/ssl/certs/primusspark_origin.crt;
    ssl_certificate_key /etc/ssl/private/primusspark_origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PORTAL_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 25m;

    location = /nginx-healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://portal_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;

        # Override the client-provided forwarding chain; the tunnel is the
        # only ingress.
        proxy_set_header X-Real-IP       $portal_client_ip;
        proxy_set_header X-Forwarded-For $portal_client_ip;

        # Forward only the canonical Access assertion; the app verifies it.
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;

        # Strip identity aliases that clients/internal callers could spoof.
        proxy_set_header CF-Access-Authenticated-User-Email "";
        proxy_set_header X-Auth-User-Email "";
        proxy_set_header X-Cf-Access-Jwt "";
        proxy_set_header X-Portal-User "";
        proxy_set_header X-Portal-Role "";
        proxy_set_header X-Portal-Actor "";
        proxy_set_header X-Portal-Principal "";

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $portal_connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

server {
    listen 127.0.0.1:80;
    server_name portal.primusspark.com;
    return 301 https://$host$request_uri;
}
