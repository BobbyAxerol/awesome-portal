server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Portal API and SSE remain behind the same public origin as the React app.
    location /api/ {
        proxy_pass http://portal-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # The Roadmap & Task Board API remains private to the Portal network. The
    # public web entry point strips this route prefix before forwarding to its
    # FastAPI contract, so it never overlaps the QuantBT `/api` namespace.
    location ^~ /roadmap-task-board/api/ {
        proxy_pass http://roadmap-task-board-api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Roadmap & Task Board is a tracked Portal feature embedded into this same
    # web container. Keep the former route as a narrow compatibility alias.
    location = /migration {
        return 301 /roadmap-task-board/;
    }

    location = /migration/ {
        return 301 /roadmap-task-board/;
    }

    location = /roadmap-task-board {
        return 301 /roadmap-task-board/;
    }

    location ^~ /roadmap-task-board/ {
        try_files $uri $uri/ /roadmap-task-board/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
