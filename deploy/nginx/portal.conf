server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Screen envelopes are JSON of repeated rows, which is the shape gzip is
    # best at: the Paper overview measured 1 549 021 bytes on the wire and
    # 98 289 compressed. nginx ships with compression off, so every one of
    # those bytes was being sent uncompressed.
    #
    # `gzip_proxied any` matters here because the API responses arrive through
    # proxy_pass, and without it nginx would leave exactly the large responses
    # this is for untouched.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    # Below this size compression costs more than it saves, and — the reason
    # the number is not lower — it keeps short token-bearing bodies out of the
    # compressed set. A compressed response that mixes a secret with
    # attacker-influenced text is the BREACH shape; `/api/auth/` is excluded
    # outright below, and this bound keeps the rest of the small ones plain.
    gzip_min_length 1024;
    # The V2 contract is negotiated on Accept; the response Content-Type stays
    # application/json, so listing the vendor media type here would only push
    # the MIME hash over its bucket size and stop nginx from starting — which
    # is exactly what it did the first time.
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        image/svg+xml;

    # Infra health stays on the Python contract and never needs a session,
    # so smoke probes and orchestrators keep working regardless of the
    # façade wire (façade requires an authenticated session on /api/).
    location = /api/health {
        proxy_pass http://portal-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    location = /api/ready {
        proxy_pass http://portal-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    # QuantBT run events use the same selected Portal upstream as all other API
    # routes. With the default Control API upstream this adds session auth and
    # a non-buffering TypeScript stream bridge; the one-line legacy rollback
    # still sends the stream directly to portal-api.
    location ~ ^/api/runs/[^/]+/events$ {
        proxy_pass http://${PORTAL_WEB_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The U10 façade wire: every other /api/ request first hits the Control
    # API BFF (auth + RBAC + signed principal + audit/outbox), which proxies
    # to the Python services. PORTAL_WEB_UPSTREAM is rendered from the
    # container env by the official nginx envsubst template entrypoint.
    #
    # Rollback: set PORTAL_WEB_UPSTREAM=portal-api:8000 and restart the web
    # container to bypass the façade entirely (health/ready still bypass).
    # Session and CSRF bodies stay uncompressed: they are the only responses
    # that carry a token, and a token must never share a compression context.
    location ^~ /api/auth/ {
        gzip off;
        proxy_pass http://${PORTAL_WEB_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://${PORTAL_WEB_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Planning commands pass through the authenticated Control API. It derives
    # the actor from the Portal session and then maps this public prefix onto
    # the private Roadmap & Task Board sidecar's `/api` namespace.
    location ^~ /roadmap-task-board/api/ {
        proxy_pass http://${PORTAL_WEB_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Cookie $http_cookie;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Roadmap & Task Board is a tracked Portal feature embedded into this same
    # web container. Keep the former route as a narrow compatibility alias.
    location = /migration {
        return 301 /roadmap-task-board/;
    }

    location = /migration/ {
        return 301 /roadmap-task-board/;
    }

    location = /roadmap-task-board {
        return 301 /roadmap-task-board/;
    }

    location ^~ /roadmap-task-board/ {
        try_files $uri $uri/ /roadmap-task-board/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
