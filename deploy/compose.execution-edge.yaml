name: portal-execution-edge

services:
  execution-edge:
    image: ${PORTAL_EXECUTION_EDGE_IMAGE:?set PORTAL_EXECUTION_EDGE_IMAGE to an immutable digest}
    pull_policy: always
    restart: unless-stopped
    init: true
    user: "65532:65532"
    group_add:
      - "${PORTAL_RUNTIME_GID:?set the numeric portal-runtime group ID}"
    read_only: true
    pids_limit: 128
    cpus: "2.0"
    mem_limit: 2048m
    mem_reservation: 512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
    ports:
      # Run profile-isolated Compose projects on distinct private host ports
      # (recommended: Paper 8443, Sandbox 8444, Live 8445). Container traffic
      # remains fixed on 8443 and no port binds a public interface.
      - "${EDGE_PRIVATE_BIND_IP:?set the WireGuard address}:${EDGE_PRIVATE_PORT:-8443}:8443"
    volumes:
      - type: bind
        source: ${EDGE_SECRET_DIRECTORY:?set the root-only edge secret directory}
        target: /run/secrets
        read_only: true
    environment:
      RUST_LOG: ${EDGE_RUST_LOG:-info}
      EDGE_BIND_ADDRESS: 0.0.0.0:8443
      EDGE_HEALTH_BIND_ADDRESS: 127.0.0.1:9100
      EDGE_ENVIRONMENT: ${EDGE_ENVIRONMENT:?paper, sandbox, or live}
      EDGE_TLS_CERTIFICATE_FILE: /run/secrets/edge-server.crt
      EDGE_TLS_PRIVATE_KEY_FILE: /run/secrets/edge-server.key
      EDGE_TLS_CLIENT_CA_FILE: /run/secrets/sgp-client-ca.crt
      EDGE_DELEGATION_JWKS_FILE: /run/secrets/control-api.jwks.json
      EDGE_DELEGATION_ISSUER: ${EDGE_DELEGATION_ISSUER:-portal-control-api}
      EDGE_DELEGATION_AUDIENCE: ${EDGE_DELEGATION_AUDIENCE:?use an environment-specific audience}
      EDGE_DELEGATION_MAXIMUM_TTL_SECONDS: ${EDGE_DELEGATION_MAXIMUM_TTL_SECONDS:-60}
      EDGE_SOURCE_ORIGIN: ${EDGE_SOURCE_ORIGIN:?set the private Trading System gateway origin}
      EDGE_SOURCE_CA_FILE: /run/secrets/trading-system-ca.crt
      EDGE_SOURCE_CLIENT_IDENTITY_FILE: ${EDGE_SOURCE_CLIENT_IDENTITY_FILE:-}
      EDGE_SOURCE_API_KEY_FILE: ${EDGE_SOURCE_API_KEY_FILE:-}
      EDGE_SOURCE_GATEWAY_DIGEST: ${EDGE_SOURCE_GATEWAY_DIGEST:?set the observed immutable gateway digest}
      # D2 is application-dark and must not contact even public source routes.
      # D3 enables contract/health probes in a separately reviewed overlay.
      EDGE_SOURCE_PROBES_ENABLED: ${EDGE_SOURCE_PROBES_ENABLED:-false}
      # Manager-v2 is a separate deployment-profile-bound read-through surface.
      # It remains dark until a dedicated Portal release supplies the delegated
      # resource claim and its exact profile binding.
      EDGE_MANAGER_V2_READ_ENABLED: ${EDGE_MANAGER_V2_READ_ENABLED:-false}
      EDGE_MANAGER_V2_PROFILE_ID: ${EDGE_MANAGER_V2_PROFILE_ID:-}
      # N24 ingestion runs in a separate no-port worker. Keep this false on
      # the serving Edge container even when the worker overlay is active.
      EDGE_MANAGER_PROJECTION_ENABLED: ${EDGE_MANAGER_PROJECTION_ENABLED:-false}
      EDGE_MANAGER_PROJECTION_REBUILD_AUTHORIZED: ${EDGE_MANAGER_PROJECTION_REBUILD_AUTHORIZED:-false}
      EDGE_MANAGER_PROJECTION_ROLLBACK_AUTHORIZED: ${EDGE_MANAGER_PROJECTION_ROLLBACK_AUTHORIZED:-false}
      EDGE_MANAGER_PROJECTION_FAILED_EPOCH_ID: ${EDGE_MANAGER_PROJECTION_FAILED_EPOCH_ID:-}
      EDGE_MANAGER_PROJECTION_RETAINED_EPOCH_ID: ${EDGE_MANAGER_PROJECTION_RETAINED_EPOCH_ID:-}
      EDGE_MANAGER_PROJECTION_OWNER_DIGEST: ${EDGE_MANAGER_PROJECTION_OWNER_DIGEST:-}
      EDGE_MANAGER_PROJECTION_POLL_INTERVAL_MS: ${EDGE_MANAGER_PROJECTION_POLL_INTERVAL_MS:-2000}
      # N21 uses the local projection PostgreSQL as the cross-replica source
      # budget authority. It never reaches the SGP Control API database.
      EDGE_MANAGER_SHARED_ADMISSION_MAXIMUM_RPS: ${EDGE_MANAGER_SHARED_ADMISSION_MAXIMUM_RPS:-8}
      EDGE_MANAGER_SHARED_ADMISSION_MAXIMUM_CONCURRENCY: ${EDGE_MANAGER_SHARED_ADMISSION_MAXIMUM_CONCURRENCY:-8}
      EDGE_MANAGER_SHARED_ADMISSION_MAXIMUM_WAIT_MS: ${EDGE_MANAGER_SHARED_ADMISSION_MAXIMUM_WAIT_MS:-1000}
      EDGE_MANAGER_SHARED_ADMISSION_LEASE_TTL_MS: ${EDGE_MANAGER_SHARED_ADMISSION_LEASE_TTL_MS:-7000}
      EDGE_MANAGER_SHARED_CACHE_TTL_MS: ${EDGE_MANAGER_SHARED_CACHE_TTL_MS:-750}
      EDGE_PROBE_ALPHA_ID: ${EDGE_PROBE_ALPHA_ID:-}
      EDGE_PROBE_INTERVAL_SECONDS: ${EDGE_PROBE_INTERVAL_SECONDS:-30}
      EDGE_CONNECT_TIMEOUT_MS: ${EDGE_CONNECT_TIMEOUT_MS:-2000}
      EDGE_REQUEST_TIMEOUT_MS: ${EDGE_REQUEST_TIMEOUT_MS:-5000}
      EDGE_QUEUE_TIMEOUT_MS: ${EDGE_QUEUE_TIMEOUT_MS:-250}
      EDGE_MAXIMUM_CONCURRENCY: ${EDGE_MAXIMUM_CONCURRENCY:-32}
      EDGE_MAXIMUM_RESPONSE_BYTES: ${EDGE_MAXIMUM_RESPONSE_BYTES:-2097152}
      EDGE_MAXIMUM_RETRIES: ${EDGE_MAXIMUM_RETRIES:-1}
      EDGE_RETRY_BACKOFF_MS: ${EDGE_RETRY_BACKOFF_MS:-100}
      # EX-BE-03 remains off until projection PostgreSQL placement and cross-cell
      # operational evidence are owner-approved.
      EDGE_PROJECTION_INGESTION_ENABLED: ${EDGE_PROJECTION_INGESTION_ENABLED:-false}
      EDGE_PROJECTION_DATABASE_URL_FILE: ${EDGE_PROJECTION_DATABASE_URL_FILE:-/run/secrets/projection-database-url}
      # EX-BE-06 is independently activated only after projection source,
      # SGP↔AWS HTTP/2 and 100-client evidence are accepted.
      EDGE_REALTIME_SSE_ENABLED: ${EDGE_REALTIME_SSE_ENABLED:-false}
      # legacy_shadow preserves N08; manager_projection consumes only the
      # durable N24/N25 Portal journal and never starts an ingestion worker.
      EDGE_REALTIME_AUTHORITY_MODE: ${EDGE_REALTIME_AUTHORITY_MODE:-legacy_shadow}
      EDGE_REALTIME_ACTIVATION_MANIFEST_FILE: ${EDGE_REALTIME_ACTIVATION_MANIFEST_FILE:-/run/secrets/realtime-activation.json}
      EDGE_REALTIME_QUEUE_CAPACITY: ${EDGE_REALTIME_QUEUE_CAPACITY:-256}
      EDGE_REALTIME_REPLAY_LIMIT: ${EDGE_REALTIME_REPLAY_LIMIT:-1024}
      EDGE_REALTIME_POLL_INTERVAL_MS: ${EDGE_REALTIME_POLL_INTERVAL_MS:-100}
      EDGE_REALTIME_POLL_BATCH: ${EDGE_REALTIME_POLL_BATCH:-512}
      EDGE_REALTIME_HEARTBEAT_SECONDS: ${EDGE_REALTIME_HEARTBEAT_SECONDS:-15}
      EDGE_REALTIME_EPOCH_JITTER_MS: ${EDGE_REALTIME_EPOCH_JITTER_MS:-5000}
      EDGE_REALTIME_FRESHNESS_POLICY_VERSION: ${EDGE_REALTIME_FRESHNESS_POLICY_VERSION:-paper.realtime.v1}
      EDGE_REALTIME_FRESHNESS_WARNING_AFTER_MS: ${EDGE_REALTIME_FRESHNESS_WARNING_AFTER_MS:-2000}
      EDGE_REALTIME_FRESHNESS_STALE_AFTER_MS: ${EDGE_REALTIME_FRESHNESS_STALE_AFTER_MS:-10000}
      EDGE_REALTIME_MAXIMUM_FUTURE_SKEW_MS: ${EDGE_REALTIME_MAXIMUM_FUTURE_SKEW_MS:-2000}
      EDGE_REALTIME_VENUE_SESSION: ${EDGE_REALTIME_VENUE_SESSION:-UNKNOWN}
      # EX-BE-07b is independently dark; profile must match the source snapshot
      # exactly when an owner-approved overlay eventually enables it.
      EDGE_ANALYTICS_QUERY_ENABLED: ${EDGE_ANALYTICS_QUERY_ENABLED:-false}
      EDGE_ANALYTICS_SOURCE_PROFILE: ${EDGE_ANALYTICS_SOURCE_PROFILE:-fixture}
      # N07 promotion is a separate three-gate rollout: projection ACTIVE,
      # Query enabled, then the exact Paper Workbench screen enabled.
      EDGE_SHADOW_QUERY_ENABLED: ${EDGE_SHADOW_QUERY_ENABLED:-false}
      EDGE_PAPER_WORKBENCH_SHADOW_ENABLED: ${EDGE_PAPER_WORKBENCH_SHADOW_ENABLED:-false}
      EDGE_QUERY_CURSOR_KEYS_FILE: ${EDGE_QUERY_CURSOR_KEYS_FILE:-}
      EDGE_QUERY_CURSOR_ACTIVE_KEY_ID: ${EDGE_QUERY_CURSOR_ACTIVE_KEY_ID:-shadow-q1}
      EDGE_QUERY_CURSOR_TTL_SECONDS: ${EDGE_QUERY_CURSOR_TTL_SECONDS:-300}
      EDGE_SHADOW_QUERY_FRESHNESS_POLICY_VERSION: ${EDGE_SHADOW_QUERY_FRESHNESS_POLICY_VERSION:-paper.shadow-query.v1}
      EDGE_SHADOW_QUERY_FRESHNESS_WARNING_AFTER_MS: ${EDGE_SHADOW_QUERY_FRESHNESS_WARNING_AFTER_MS:-5000}
      EDGE_SHADOW_QUERY_FRESHNESS_STALE_AFTER_MS: ${EDGE_SHADOW_QUERY_FRESHNESS_STALE_AFTER_MS:-30000}
      EDGE_SHADOW_QUERY_MAXIMUM_FUTURE_SKEW_MS: ${EDGE_SHADOW_QUERY_MAXIMUM_FUTURE_SKEW_MS:-2000}
      # EX-BE-05b/F0 cannot relay commands; a true value is rejected at startup.
      EDGE_COMMAND_RELAY_ENABLED: ${EDGE_COMMAND_RELAY_ENABLED:-false}
    healthcheck:
      test: ["CMD", "/usr/local/bin/portal-execution-edge", "healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - execution-private

networks:
  execution-private:
    driver: bridge
