# N26 profile-isolated projection-backed realtime overlay for the AWS-HK Edge.
#
# Apply to one already-qualified Paper/Sandbox/Live serving Edge at a time.
# The N24 projection worker remains a separate no-port service; this overlay
# reads its ACTIVE epoch and journal only. Commands remain independently dark.
services:
  execution-edge:
    environment:
      EDGE_MANAGER_V2_READ_ENABLED: "true"
      EDGE_MANAGER_V2_PROFILE_ID: ${EDGE_MANAGER_V2_PROFILE_ID:?set the exact profile ID}
      EDGE_MANAGER_PROJECTION_ENABLED: "false"
      EDGE_ANALYTICS_QUERY_ENABLED: "true"
      EDGE_REALTIME_SSE_ENABLED: "true"
      EDGE_REALTIME_AUTHORITY_MODE: manager_projection
      EDGE_REALTIME_ACTIVATION_MANIFEST_FILE: /run/secrets/realtime-manager-activation.json
      EDGE_COMMAND_RELAY_ENABLED: "false"
