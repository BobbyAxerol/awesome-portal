# N25 profile-isolated projection-backed analytics overlay for the AWS-HK Edge.
#
# Apply to one already-qualified Paper/Sandbox/Live serving Edge at a time.
# Realtime and commands stay independently dark so N25 can be accepted and
# rolled back without changing the N24 worker or the N26 stream authority.
services:
  execution-edge:
    environment:
      EDGE_MANAGER_V2_READ_ENABLED: "true"
      EDGE_MANAGER_V2_PROFILE_ID: ${EDGE_MANAGER_V2_PROFILE_ID:?set the exact profile ID}
      EDGE_MANAGER_PROJECTION_ENABLED: "false"
      EDGE_ANALYTICS_QUERY_ENABLED: "true"
      EDGE_REALTIME_SSE_ENABLED: "false"
      EDGE_COMMAND_RELAY_ENABLED: "false"
