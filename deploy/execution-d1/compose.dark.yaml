# D2 preparation overlay only. D1 may render this file but must never pull or
# start it. The Source Proxy uses host networking solely to reach the published
# Trading System loopback origin and binds only the Portal bridge gateway.
services:
  execution-edge:
    depends_on:
      source-proxy:
        condition: service_healthy
      projection-migrator:
        condition: service_completed_successfully
    environment:
      EDGE_SOURCE_ORIGIN: ${EDGE_SOURCE_ORIGIN:?set the private Source Proxy HTTPS origin}
      EDGE_SOURCE_CA_FILE: /run/secrets/source-proxy-ca.crt
      EDGE_SOURCE_CLIENT_IDENTITY_FILE: ${EDGE_SOURCE_CLIENT_IDENTITY_FILE:?set the separate Source Proxy client identity file}
      # This is a non-TS admission sentinel. The Source Proxy discards it and
      # injects the real TS read identity, which never enters this container.
      EDGE_SOURCE_API_KEY_FILE: ${EDGE_SOURCE_API_KEY_FILE:?set the Source Proxy admission-token file}
      EDGE_SOURCE_PROBES_ENABLED: "false"
      EDGE_MANAGER_V2_READ_ENABLED: "false"
      EDGE_PROJECTION_INGESTION_ENABLED: "false"
      EDGE_REALTIME_SSE_ENABLED: "false"
      EDGE_ANALYTICS_QUERY_ENABLED: "false"
      EDGE_ANALYTICS_SOURCE_PROFILE: fixture
      EDGE_COMMAND_RELAY_ENABLED: "false"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
          pids: 128
        reservations:
          cpus: "0.75"
          memory: 512M

  projection-postgres:
    image: ${PORTAL_PROJECTION_POSTGRES_IMAGE:?set a pinned official PostgreSQL 16 digest}
    pull_policy: always
    restart: unless-stopped
    init: true
    read_only: true
    pids_limit: 128
    cpus: "1.5"
    mem_limit: 2048m
    mem_reservation: 512m
    shm_size: 128m
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-bootstrap-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
      PROJECTION_DB_NAME: ${PROJECTION_DB_NAME:?set the Portal projection database}
      PROJECTION_DB_OWNER_USER: ${PROJECTION_DB_OWNER_USER:?set the migration owner role}
      PROJECTION_DB_RUNTIME_USER: ${PROJECTION_DB_RUNTIME_USER:?set the runtime role}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/secrets/projection-postgres.crt
      - -c
      - ssl_key_file=/run/secrets/projection-postgres.key
      - -c
      - password_encryption=scram-sha-256
    volumes:
      - projection-postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ${PROJECTION_DB_SECRET_DIRECTORY:?set the root-owned projection DB secret directory}
        target: /run/secrets
        read_only: true
      - type: bind
        source: ${PROJECTION_DB_INIT_SCRIPT:?set the reviewed role/bootstrap script}
        target: /docker-entrypoint-initdb.d/10-portal-projection.sh
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /run/postgresql:rw,noexec,nosuid,nodev,size=8m,mode=3775,uid=70,gid=70
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U postgres -d postgres"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - execution-private
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2048M
          pids: 128
        reservations:
          cpus: "0.50"
          memory: 512M

  projection-migrator:
    image: ${PORTAL_EXECUTION_EDGE_IMAGE:?set PORTAL_EXECUTION_EDGE_IMAGE to an immutable digest}
    pull_policy: always
    restart: "no"
    init: true
    user: "65532:65532"
    group_add:
      - "${PORTAL_RUNTIME_GID:?set the numeric portal-runtime group ID}"
    read_only: true
    pids_limit: 64
    cpus: "1.0"
    mem_limit: 1024m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      EDGE_PROJECTION_DATABASE_URL_FILE: /run/secrets/projection-migration-database-url
    command: ["projection-migrate"]
    volumes:
      - type: bind
        source: ${EDGE_SECRET_DIRECTORY:?set the root-owned edge secret directory}
        target: /run/secrets
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    depends_on:
      projection-postgres:
        condition: service_healthy
    networks:
      - execution-private
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
          pids: 64

  source-proxy:
    image: ${PORTAL_SOURCE_PROXY_IMAGE:?set PORTAL_SOURCE_PROXY_IMAGE to an immutable digest}
    pull_policy: always
    restart: unless-stopped
    init: true
    user: "101:101"
    group_add:
      - "${PORTAL_RUNTIME_GID:?set the numeric portal-runtime group ID}"
    read_only: true
    pids_limit: 64
    cpus: "0.50"
    mem_limit: 512m
    mem_reservation: 128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: host
    volumes:
      - type: bind
        source: ${SOURCE_PROXY_CONFIG_FILE:?set the rendered root-owned Source Proxy config}
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ${SOURCE_PROXY_SECRET_DIRECTORY:?set the root-owned Source Proxy secret directory}
        target: /run/secrets
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=8m,mode=0750,uid=101,gid=101
    ulimits:
      nofile:
        soft: 512
        hard: 1024
    healthcheck:
      test: ["CMD", "nginx", "-t", "-q"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 10s
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
          pids: 64
        reservations:
          cpus: "0.10"
          memory: 128M

networks:
  execution-private:
    driver: bridge
    ipam:
      config:
        - subnet: ${PORTAL_BRIDGE_CIDR:?set the approved Portal-only bridge CIDR}
          gateway: ${PORTAL_BRIDGE_GATEWAY_IP:?set the approved Portal bridge gateway IP}

volumes:
  projection-postgres-data:
    name: ${PROJECTION_DB_VOLUME_NAME:?set a versioned Portal-owned volume name}
