name: Portal security analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: Check out parent workspace
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure access to child repositories
        env:
          PORTAL_REPOS_TOKEN: ${{ secrets.PORTAL_REPOS_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${PORTAL_REPOS_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Fetch locked child source
        run: ./scripts/portal sync --locked

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v3
