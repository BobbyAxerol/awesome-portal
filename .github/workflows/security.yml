name: Portal security analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  # CodeQL reads workflow-run metadata during analysis. Keep the token
  # least-privileged: no workflow write access or repository mutation.
  actions: read
  contents: read
  security-events: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: [self-hosted, linux, x64, portal-ci]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: Check out Portal source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Bind disposable job temporary directory
        run: printf 'TMPDIR=%s\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"

      - name: Assert isolated CI runner boundary
        run: ./scripts/assert-self-hosted-ci-publish-runner.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          # This private repository does not currently have GitHub Code
          # Security enabled. Analyse every supported language nevertheless,
          # but retain SARIF as a private Actions artifact instead of failing
          # on an unavailable Code Scanning upload. When Code Security is
          # enabled, change this to `always` in the same reviewed PR.
          upload: never
          output: ${{ runner.temp }}/portal-codeql-results/${{ matrix.language }}

      - name: Archive private CodeQL SARIF evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portal-codeql-${{ matrix.language }}-${{ github.sha }}
          path: ${{ runner.temp }}/portal-codeql-results/${{ matrix.language }}
          if-no-files-found: error
          retention-days: 30
