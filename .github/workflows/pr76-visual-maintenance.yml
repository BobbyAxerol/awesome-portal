name: PR76 visual baseline maintenance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-baseline:
    name: Re-record PR #76 visual baseline
    runs-on: [self-hosted, linux, x64, portal-ci]
    timeout-minutes: 30
    steps:
      - name: Check out Portal source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Bind disposable job temporary directory
        run: printf 'TMPDIR=%s\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"

      - name: Assert isolated CI runner boundary
        run: ./scripts/assert-self-hosted-ci-publish-runner.sh

      - name: Re-record the pinned visual baseline
        run: ./scripts/portal-web-visual.sh --update

      - name: Archive updated snapshot
        uses: actions/upload-artifact@v7
        with:
          name: pr76-visual-baseline-${{ github.sha }}
          path: apps/portal/frontend/e2e/execution-fixtures.spec.ts-snapshots/execution-wired-flow-list-detail-plan-apply-poll-laptop-chromium-linux.png
          if-no-files-found: error
          retention-days: 1
