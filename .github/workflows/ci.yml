name: Portal integration CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Validate locked Portal stack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out parent workspace
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure access to child repositories
        env:
          PORTAL_REPOS_TOKEN: ${{ secrets.PORTAL_REPOS_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${PORTAL_REPOS_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Fetch locked child source
        run: ./scripts/portal sync --locked

      - name: Validate workspace contracts
        run: ./scripts/portal verify --require-sources

      - name: Lint GitHub Actions definitions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/quantbt-portal/backend/pyproject.toml

      - name: Test QuantBT Portal backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint constraints/portal.txt -e './apps/quantbt-portal/backend[dev]'
          (
            cd apps/quantbt-portal
            sha256sum -c strategy/PROTECTED_SHA256
          )
          PYTHONPATH=apps/quantbt-portal/backend/src:apps/quantbt-portal \
            python -m pytest -c apps/quantbt-portal/backend/pyproject.toml apps/quantbt-portal/backend/tests
          python -m compileall -q apps/quantbt-portal/backend/src apps/quantbt-portal/strategy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/quantbt-portal/frontend/package-lock.json
            features/roadmap-task-board/frontend/package-lock.json

      - name: Test and build QuantBT Portal frontend
        working-directory: apps/quantbt-portal/frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Test and build embedded Roadmap & Task Board
        working-directory: features/roadmap-task-board/frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Smoke-test composed services
        env:
          PORTAL_STACK_NAME: portal-ci
          PORTAL_HTTP_PORT: "18080"
          PORTAL_IMAGE_PREFIX: local/portal-ci
          PORTAL_IMAGE_TAG: ${{ github.sha }}
          PORTAL_MARKET_DATA_DIR: ./runtime/market-data
        run: ./scripts/portal smoke
