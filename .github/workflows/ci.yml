name: Portal CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Validate Portal monorepo stack
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out Portal source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Protect append-only migration history
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/verify-migration-history.sh "${BASE_SHA}"

      - name: Validate Portal contracts
        run: ./scripts/portal verify

      - name: Lint GitHub Actions definitions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

      - name: Test shared contracts workspace
        run: ./scripts/contracts-test.sh

      - name: Test Control API
        run: ./scripts/control-api-test.sh

      - name: Rehearse N14A source-dark release authority
        run: ./scripts/portal-release-authority-test.sh

      - name: Rehearse N14B immutable current-source compatibility
        run: ./scripts/portal-current-source-release-test.sh

      - name: Validate N15A source-dark gateway authority
        run: ./scripts/execution-n15a-gateway-test.sh

      - name: Validate N15B current-capability gateway acceptance
        run: ./scripts/execution-n15b-current-gateway-test.sh

      - name: Validate N16A source-dark emergency routing authority
        run: ./scripts/execution-n16a-emergency-routing-test.sh

      - name: Rehearse N17A source-dark production and DR readiness
        run: ./scripts/execution-n17a-production-dr-test.sh

      - name: Test Rust execution edge
        run: ./scripts/execution-edge-test.sh

      - name: Portal web visual baseline
        run: ./scripts/portal-web-visual.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # BAR-05 freezes the exact Python patch used by CI and runtime images.
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            apps/portal/backend/pyproject.toml
            features/roadmap-task-board/backend/requirements-dev.txt

      - name: Test Portal Research backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint constraints/portal.txt -e './apps/portal/backend[dev]'
          (
            cd apps/portal
            sha256sum -c strategy/PROTECTED_SHA256
          )
          PYTHONPATH=apps/portal/backend/src:apps/portal \
            python -m pytest -c apps/portal/backend/pyproject.toml apps/portal/backend/tests
          python -m compileall -q apps/portal/backend/src apps/portal/strategy

      - name: Test Roadmap & Task Board backend
        run: |
          python -m pip install -r features/roadmap-task-board/backend/requirements-dev.txt
          PYTHONPATH=features/roadmap-task-board python -m pytest features/roadmap-task-board/backend/tests
          python -m compileall -q features/roadmap-task-board/backend

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/portal/frontend/package-lock.json
            features/roadmap-task-board/frontend/package-lock.json

      - name: Test and build Portal Research frontend
        working-directory: apps/portal/frontend
        run: |
          npm ci
          # Portal compiles the embedded Planning feature from source. A clean
          # runner therefore needs Planning's dependency graph before tsc/vite,
          # even though its own test/build step runs immediately afterward.
          npm ci --prefix ../../../features/roadmap-task-board/frontend
          npm audit --package-lock-only --audit-level=moderate
          npm test
          npm run build

      - name: Test and build Roadmap & Task Board
        working-directory: features/roadmap-task-board/frontend
        run: |
          npm audit --package-lock-only --audit-level=moderate
          npm test
          npm run build

      - name: Install Chromium for Roadmap browser parity
        working-directory: features/roadmap-task-board/frontend
        run: npx playwright install --with-deps chromium

      - name: Run Roadmap local-first browser flows
        working-directory: features/roadmap-task-board/frontend
        run: npm run e2e

      - name: Smoke-test composed services
        env:
          PORTAL_STACK_NAME: portal-ci
          PORTAL_HTTP_PORT: "18080"
          PORTAL_IMAGE_PREFIX: local/portal-ci
          PORTAL_IMAGE_TAG: ${{ github.sha }}
          PORTAL_HISTORICAL_DATA_MODE: disabled
          PORTAL_HISTORICAL_DATA_DIR: ./runtime/historical-market-data
        run: ./scripts/portal smoke
