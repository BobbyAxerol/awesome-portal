name: Roadmap & Task Board CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roadmap-task-board-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend contract and operations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r backend/requirements-dev.txt
      - name: Test API, migration, webhook and backup contracts
        run: PYTHONPATH=. python -m pytest backend/tests
      - name: Compile Python sources
        run: python -m compileall -q backend

  frontend:
    name: Frontend unit, build and browser parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run component and integrity tests
        run: npm test
      - name: Build production assets
        run: npm run build
      - name: Install Chromium for browser parity tests
        run: npx playwright install --with-deps chromium
      - name: Run local-first browser flows
        run: npm run e2e
