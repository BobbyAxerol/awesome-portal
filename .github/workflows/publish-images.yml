name: Build and publish Portal images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      scope:
        description: Images to publish from the selected immutable ref
        required: true
        default: all
        type: choice
        options:
          - all
          - execution-d2
          - execution-d3

permissions:
  actions: read
  checks: read
  contents: read
  packages: write
  id-token: write

concurrency:
  group: portal-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 105

    steps:
      - name: Check out Portal source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require main for manual publication
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            printf 'Manual production image publication must run from main, found: %s\n' "${GITHUB_REF}" >&2
            exit 1
          fi

      - name: Wait for commit-bound Portal CI release gates
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.scope == 'all')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-gates
          for attempt in $(seq 1 90); do
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
              > release-gates/portal-ci-check-runs.json
            conclusion="$(jq -r '
              [.check_runs[]
                | select(.name == "Validate Portal monorepo stack")
                | .conclusion] | last // "pending"
            ' release-gates/portal-ci-check-runs.json)"
            if [[ "${conclusion}" == "success" ]]; then
              break
            fi
            if [[ "${conclusion}" =~ ^(failure|cancelled|timed_out|action_required|stale)$ ]]; then
              printf 'Portal CI rejected release commit %s: %s\n' \
                "${GITHUB_SHA}" "${conclusion}" >&2
              exit 1
            fi
            if [[ "${attempt}" == "90" ]]; then
              printf 'Timed out waiting for Portal CI on %s.\n' "${GITHUB_SHA}" >&2
              exit 1
            fi
            sleep 30
          done
          jq -e '
            .check_runs
            | any(.name == "Validate Portal monorepo stack"
                and .head_sha == env.GITHUB_SHA
                and .conclusion == "success")
          ' release-gates/portal-ci-check-runs.json >/dev/null

      - name: Derive lowercase image prefix
        id: image-prefix
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner_lower="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          printf 'value=ghcr.io/%s/portal\n' "${owner_lower}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive API image metadata
        id: api-meta
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-prefix.outputs.value }}-portal-api
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Derive web image metadata
        id: web-meta
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-prefix.outputs.value }}-portal-web
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Derive Control API image metadata
        id: control-api-meta
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'execution-d3'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-prefix.outputs.value }}-control-api
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Derive Roadmap & Task Board API image metadata
        id: roadmap-task-board-api-meta
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-prefix.outputs.value }}-roadmap-task-board-api
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Derive execution edge image metadata
        id: execution-edge-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-prefix.outputs.value }}-execution-edge
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Derive source proxy image metadata
        id: source-proxy-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-prefix.outputs.value }}-source-proxy
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Stage approved Historical Market Data reader wheel
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
        env:
          HMD_READER_WHEEL_BASE64: ${{ secrets.HMD_READER_WHEEL_BASE64 }}
        run: |
          if [[ -z "${HMD_READER_WHEEL_BASE64}" ]]; then
            printf 'Required HMD_READER_WHEEL_BASE64 repository/environment secret is missing.\n' >&2
            exit 1
          fi
          mkdir -p vendor/hmd-reader
          printf '%s' "${HMD_READER_WHEEL_BASE64}" | base64 --decode \
            > vendor/hmd-reader/primus_historical_market_data-0.1.0rc3-py3-none-any.whl
          printf '%s  %s\n' \
            '3b2a41b87ff834912556bb3039bf3e3c148bd859a1ced9ee4f52a3c658ca5663' \
            'vendor/hmd-reader/primus_historical_market_data-0.1.0rc3-py3-none-any.whl' \
            | sha256sum -c -

      - name: Build and publish API image
        id: portal-api-build
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/images/portal-api.Dockerfile
          build-args: |
            PORTAL_HMD_READER_REQUIRED=true
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=portal-api
          cache-to: type=gha,mode=max,scope=portal-api

      - name: Build and publish web image
        id: portal-web-build
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/images/portal-web.Dockerfile
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=portal-web
          cache-to: type=gha,mode=max,scope=portal-web

      - name: Build and publish Control API image
        id: control-api-build
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'execution-d3'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/images/control-api.Dockerfile
          push: true
          tags: ${{ steps.control-api-meta.outputs.tags }}
          labels: ${{ steps.control-api-meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=control-api
          cache-to: type=gha,mode=max,scope=control-api

      - name: Build and publish Roadmap & Task Board API image
        id: roadmap-task-board-api-build
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/images/roadmap-task-board-api.Dockerfile
          push: true
          tags: ${{ steps.roadmap-task-board-api-meta.outputs.tags }}
          labels: ${{ steps.roadmap-task-board-api-meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=roadmap-task-board-api
          cache-to: type=gha,mode=max,scope=roadmap-task-board-api

      - name: Build and publish execution edge image
        id: execution-edge-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/images/execution-edge.Dockerfile
          push: true
          tags: ${{ steps.execution-edge-meta.outputs.tags }}
          labels: ${{ steps.execution-edge-meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=execution-edge
          cache-to: type=gha,mode=max,scope=execution-edge

      - name: Build and publish source proxy image
        id: source-proxy-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/images/source-proxy.Dockerfile
          push: true
          tags: ${{ steps.source-proxy-meta.outputs.tags }}
          labels: ${{ steps.source-proxy-meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=source-proxy
          cache-to: type=gha,mode=max,scope=source-proxy

      - name: Scan Portal API for high and critical vulnerabilities
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image-prefix.outputs.value }}-portal-api@${{ steps.portal-api-build.outputs.digest }}
          format: json
          output: portal-api-trivy.json
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject critical Portal API vulnerabilities
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image-prefix.outputs.value }}-portal-api@${{ steps.portal-api-build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan Portal web for high and critical vulnerabilities
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image-prefix.outputs.value }}-portal-web@${{ steps.portal-web-build.outputs.digest }}
          format: json
          output: portal-web-trivy.json
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject critical Portal web vulnerabilities
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image-prefix.outputs.value }}-portal-web@${{ steps.portal-web-build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan Roadmap API for high and critical vulnerabilities
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image-prefix.outputs.value }}-roadmap-task-board-api@${{ steps.roadmap-task-board-api-build.outputs.digest }}
          format: json
          output: roadmap-task-board-api-trivy.json
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject critical Roadmap API vulnerabilities
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image-prefix.outputs.value }}-roadmap-task-board-api@${{ steps.roadmap-task-board-api-build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan execution edge for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image-prefix.outputs.value }}-execution-edge@${{ steps.execution-edge-build.outputs.digest }}
          format: json
          output: execution-edge-trivy.json
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject critical execution edge vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image-prefix.outputs.value }}-execution-edge@${{ steps.execution-edge-build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan source proxy for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image-prefix.outputs.value }}-source-proxy@${{ steps.source-proxy-build.outputs.digest }}
          format: json
          output: source-proxy-trivy.json
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject critical source proxy vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image-prefix.outputs.value }}-source-proxy@${{ steps.source-proxy-build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan D3 Control API for high and critical vulnerabilities
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'execution-d3'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image-prefix.outputs.value }}-control-api@${{ steps.control-api-build.outputs.digest }}
          format: json
          output: control-api-trivy.json
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject critical D3 Control API vulnerabilities
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'execution-d3'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image-prefix.outputs.value }}-control-api@${{ steps.control-api-build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Install keyless image signer
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign execution D2 images by immutable digest
        env:
          EXECUTION_EDGE_IMAGE: ${{ steps.image-prefix.outputs.value }}-execution-edge@${{ steps.execution-edge-build.outputs.digest }}
          SOURCE_PROXY_IMAGE: ${{ steps.image-prefix.outputs.value }}-source-proxy@${{ steps.source-proxy-build.outputs.digest }}
        run: |
          cosign sign --yes "${EXECUTION_EDGE_IMAGE}"
          cosign sign --yes "${SOURCE_PROXY_IMAGE}"

      - name: Sign SGP Portal images by immutable digest
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
        env:
          PORTAL_API_IMAGE: ${{ steps.image-prefix.outputs.value }}-portal-api@${{ steps.portal-api-build.outputs.digest }}
          PORTAL_WEB_IMAGE: ${{ steps.image-prefix.outputs.value }}-portal-web@${{ steps.portal-web-build.outputs.digest }}
          CONTROL_API_IMAGE: ${{ steps.image-prefix.outputs.value }}-control-api@${{ steps.control-api-build.outputs.digest }}
          ROADMAP_API_IMAGE: ${{ steps.image-prefix.outputs.value }}-roadmap-task-board-api@${{ steps.roadmap-task-board-api-build.outputs.digest }}
        run: |
          cosign sign --yes "${PORTAL_API_IMAGE}"
          cosign sign --yes "${PORTAL_WEB_IMAGE}"
          cosign sign --yes "${CONTROL_API_IMAGE}"
          cosign sign --yes "${ROADMAP_API_IMAGE}"

      - name: Sign D3 Control API by immutable digest
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'execution-d3'
        env:
          CONTROL_API_IMAGE: ${{ steps.image-prefix.outputs.value }}-control-api@${{ steps.control-api-build.outputs.digest }}
        run: cosign sign --yes "${CONTROL_API_IMAGE}"

      - name: Verify keyless signatures and write D2 evidence
        env:
          EXECUTION_EDGE_IMAGE: ${{ steps.image-prefix.outputs.value }}-execution-edge@${{ steps.execution-edge-build.outputs.digest }}
          SOURCE_PROXY_IMAGE: ${{ steps.image-prefix.outputs.value }}-source-proxy@${{ steps.source-proxy-build.outputs.digest }}
        run: |
          mkdir -p release/execution-d2
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-images.yml@${GITHUB_REF}"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify \
            --certificate-identity "${certificate_identity}" \
            --certificate-oidc-issuer "${issuer}" \
            --output json "${EXECUTION_EDGE_IMAGE}" \
            > release/execution-d2/execution-edge-signature.json
          cosign verify \
            --certificate-identity "${certificate_identity}" \
            --certificate-oidc-issuer "${issuer}" \
            --output json "${SOURCE_PROXY_IMAGE}" \
            > release/execution-d2/source-proxy-signature.json
          cp execution-edge-trivy.json source-proxy-trivy.json release/execution-d2/
          {
            printf 'SOURCE_COMMIT=%s\n' "${GITHUB_SHA}"
            printf 'SOURCE_REF=%s\n' "${GITHUB_REF}"
            printf 'PORTAL_EXECUTION_EDGE_IMAGE=%s\n' "${EXECUTION_EDGE_IMAGE}"
            printf 'PORTAL_SOURCE_PROXY_IMAGE=%s\n' "${SOURCE_PROXY_IMAGE}"
          } > release/execution-d2/execution-d2-image.env
          sha256sum \
            release/execution-d2/execution-d2-image.env \
            release/execution-d2/execution-edge-signature.json \
            release/execution-d2/execution-edge-trivy.json \
            release/execution-d2/source-proxy-signature.json \
            release/execution-d2/source-proxy-trivy.json \
            > release/execution-d2/SHA256SUMS

      - name: Upload execution D2 publication evidence
        uses: actions/upload-artifact@v7
        with:
          name: execution-d2-publication-${{ github.sha }}
          path: release/execution-d2
          if-no-files-found: error
          retention-days: 30

      - name: Verify keyless signature and write D3 Control API evidence
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'execution-d3'
        env:
          CONTROL_API_IMAGE: ${{ steps.image-prefix.outputs.value }}-control-api@${{ steps.control-api-build.outputs.digest }}
        run: |
          mkdir -p release/execution-d3
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-images.yml@${GITHUB_REF}"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify \
            --certificate-identity "${certificate_identity}" \
            --certificate-oidc-issuer "${issuer}" \
            --output json "${CONTROL_API_IMAGE}" \
            > release/execution-d3/control-api-signature.json
          cp control-api-trivy.json release/execution-d3/
          {
            printf 'SOURCE_COMMIT=%s\n' "${GITHUB_SHA}"
            printf 'SOURCE_REF=%s\n' "${GITHUB_REF}"
            printf 'PORTAL_CONTROL_API_IMAGE=%s\n' "${CONTROL_API_IMAGE}"
          } > release/execution-d3/execution-d3-control-api-image.env
          sha256sum \
            release/execution-d3/control-api-signature.json \
            release/execution-d3/control-api-trivy.json \
            release/execution-d3/execution-d3-control-api-image.env \
            > release/execution-d3/SHA256SUMS

      - name: Upload execution D3 publication evidence
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'execution-d3'
        uses: actions/upload-artifact@v7
        with:
          name: execution-d3-publication-${{ github.sha }}
          path: release/execution-d3
          if-no-files-found: error
          retention-days: 30

      - name: Verify all release images and generate N14A candidate
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.scope == 'all')
        env:
          PORTAL_API_IMAGE: ${{ steps.image-prefix.outputs.value }}-portal-api@${{ steps.portal-api-build.outputs.digest }}
          PORTAL_WEB_IMAGE: ${{ steps.image-prefix.outputs.value }}-portal-web@${{ steps.portal-web-build.outputs.digest }}
          CONTROL_API_IMAGE: ${{ steps.image-prefix.outputs.value }}-control-api@${{ steps.control-api-build.outputs.digest }}
          ROADMAP_API_IMAGE: ${{ steps.image-prefix.outputs.value }}-roadmap-task-board-api@${{ steps.roadmap-task-board-api-build.outputs.digest }}
          EXECUTION_EDGE_IMAGE: ${{ steps.image-prefix.outputs.value }}-execution-edge@${{ steps.execution-edge-build.outputs.digest }}
          SOURCE_PROXY_IMAGE: ${{ steps.image-prefix.outputs.value }}-source-proxy@${{ steps.source-proxy-build.outputs.digest }}
        run: |
          mkdir -p release/n14a-evidence
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-images.yml@${GITHUB_REF}"
          issuer="https://token.actions.githubusercontent.com"

          verify_release_image() {
            service="$1"
            image="$2"
            cosign verify \
              --certificate-identity "${certificate_identity}" \
              --certificate-oidc-issuer "${issuer}" \
              --output json "${image}" \
              > "release/n14a-evidence/${service}-signature.json"
            cosign verify-attestation \
              --certificate-identity "${certificate_identity}" \
              --certificate-oidc-issuer "${issuer}" \
              --type spdxjson "${image}" \
              > "release/n14a-evidence/${service}-sbom.json"
            cosign verify-attestation \
              --certificate-identity "${certificate_identity}" \
              --certificate-oidc-issuer "${issuer}" \
              --type slsaprovenance "${image}" \
              > "release/n14a-evidence/${service}-provenance.json"
          }

          verify_release_image portal-api "${PORTAL_API_IMAGE}"
          verify_release_image portal-web "${PORTAL_WEB_IMAGE}"
          verify_release_image control-api "${CONTROL_API_IMAGE}"
          verify_release_image roadmap-task-board-api "${ROADMAP_API_IMAGE}"
          verify_release_image execution-edge "${EXECUTION_EDGE_IMAGE}"
          verify_release_image source-proxy "${SOURCE_PROXY_IMAGE}"
          cp \
            portal-api-trivy.json \
            portal-web-trivy.json \
            control-api-trivy.json \
            roadmap-task-board-api-trivy.json \
            execution-edge-trivy.json \
            source-proxy-trivy.json \
            release/n14a-evidence/

          python3 scripts/portal-release-authority.py generate \
            --output-dir release/n14a-candidate \
            --source-commit "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" \
            --evidence-dir release/n14a-evidence \
            --image "portal-api=${PORTAL_API_IMAGE}" \
            --image "portal-web=${PORTAL_WEB_IMAGE}" \
            --image "control-api=${CONTROL_API_IMAGE}" \
            --image "roadmap-task-board-api=${ROADMAP_API_IMAGE}" \
            --image "execution-edge=${EXECUTION_EDGE_IMAGE}" \
            --image "source-proxy=${SOURCE_PROXY_IMAGE}" \
            --gate-evidence "contracts=release-gates/portal-ci-check-runs.json" \
            --gate-evidence "control_api=release-gates/portal-ci-check-runs.json" \
            --gate-evidence "research_backend=release-gates/portal-ci-check-runs.json" \
            --gate-evidence "planning_backend=release-gates/portal-ci-check-runs.json" \
            --gate-evidence "frontend=release-gates/portal-ci-check-runs.json" \
            --gate-evidence "migration_restore=release-gates/portal-ci-check-runs.json" \
            --gate-evidence "channel_isolation=release-gates/portal-ci-check-runs.json" \
            --gate-evidence "rollback_forward_fix=release-gates/portal-ci-check-runs.json"
          python3 scripts/portal-release-authority.py verify \
            --mode candidate --pack-dir release/n14a-candidate

      - name: Upload N14A source-dark release candidate
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.scope == 'all')
        uses: actions/upload-artifact@v7
        with:
          name: portal-release-candidate-${{ github.sha }}
          path: release/n14a-candidate
          if-no-files-found: error
          retention-days: 30

      - name: Publish deployment environment artifact
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
        env:
          IMAGE_PREFIX: ${{ steps.image-prefix.outputs.value }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          mkdir -p release
          {
            printf 'PORTAL_IMAGE_PREFIX=%s\n' "${IMAGE_PREFIX}"
            printf 'PORTAL_IMAGE_TAG=%s\n' "${IMAGE_TAG}"
          } > release/portal-image.env

      - name: Upload deployment environment artifact
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
        uses: actions/upload-artifact@v7
        with:
          name: portal-image-${{ github.sha }}
          path: release/portal-image.env
          if-no-files-found: error
          retention-days: 30
