name: Build and publish Portal images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: portal-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out parent workspace
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure access to child repositories
        env:
          PORTAL_REPOS_TOKEN: ${{ secrets.PORTAL_REPOS_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${PORTAL_REPOS_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Fetch locked child source
        run: ./scripts/portal sync --locked

      - name: Derive lowercase image prefix
        id: image-prefix
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner_lower="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          printf 'value=ghcr.io/%s/portal\n' "${owner_lower}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive API image metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-prefix.outputs.value }}-quantbt-portal-api
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Derive web image metadata
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-prefix.outputs.value }}-quantbt-portal-web
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/images/quantbt-portal-api.Dockerfile
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=quantbt-portal-api
          cache-to: type=gha,mode=max,scope=quantbt-portal-api

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/images/quantbt-portal-web.Dockerfile
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=quantbt-portal-web
          cache-to: type=gha,mode=max,scope=quantbt-portal-web

      - name: Publish deployment environment artifact
        env:
          IMAGE_PREFIX: ${{ steps.image-prefix.outputs.value }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          mkdir -p release
          {
            printf 'PORTAL_IMAGE_PREFIX=%s\n' "${IMAGE_PREFIX}"
            printf 'PORTAL_IMAGE_TAG=%s\n' "${IMAGE_TAG}"
          } > release/portal-image.env

      - name: Upload deployment environment artifact
        uses: actions/upload-artifact@v7
        with:
          name: portal-image-${{ github.sha }}
          path: release/portal-image.env
          if-no-files-found: error
          retention-days: 30
